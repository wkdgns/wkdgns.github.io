<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>KTX 도면 찾기</title>
<!--MANIFEST-->
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --sub:#5b6676; --line:#dde2ea;
  --accent:#1f5fae; --accent-ink:#ffffff; --chip:#e8eef7; --chip-ink:#1f4f8f;
  --hit:#ffe36e; --warn:#a15c00; --warn-bg:#fff4e0; --danger:#c0362c;
  --viewer-bg:#3a3f47;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --card:#1c222b; --ink:#e7ebf0; --sub:#9aa5b4; --line:#2c3440;
    --accent:#5b9bf0; --accent-ink:#0d1520; --chip:#24324a; --chip-ink:#a9c8f5;
    --hit:#b8920f; --warn:#f0b35a; --warn-bg:#33270f; --danger:#ff7b70;
    --viewer-bg:#0b0d10;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --card:#1c222b; --ink:#e7ebf0; --sub:#9aa5b4; --line:#2c3440;
  --accent:#5b9bf0; --accent-ink:#0d1520; --chip:#24324a; --chip-ink:#a9c8f5;
  --hit:#b8920f; --warn:#f0b35a; --warn-bg:#33270f; --danger:#ff7b70;
  --viewer-bg:#0b0d10;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.searchbox{display:flex;gap:8px;max-width:900px;margin:10px auto 0}
.searchbox input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px}
.tabs{display:flex;max-width:900px;margin:8px auto 0}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;border-bottom:3px solid transparent;color:var(--sub);font-weight:600}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:12px 16px 80px}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.result{cursor:pointer}
.result .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.result .fname{font-weight:700;word-break:break-all}
.result .pg{color:var(--accent);font-weight:700;white-space:nowrap}
.snip{color:var(--sub);font-size:14px;margin-top:6px;line-height:1.5;word-break:break-all}
mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.x{cursor:pointer}
.muted{color:var(--sub);font-size:14px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--accent);width:0}
label.f{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
input.t,textarea.t,select.t{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.lg-ex{color:#1e6eff}.lg-pt{color:#f0b400}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px;border:0;background:var(--card);font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pre{white-space:pre-wrap}
.btn.good{background:#2a9d5c;color:#fff;border-color:#2a9d5c}.btn.bad{background:var(--danger);color:#fff;border-color:var(--danger)}
.card.step.ok{border-left:5px solid #2a9d5c}.card.step.ng{border-left:5px solid var(--danger)}
.trail{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line);white-space:nowrap;align-items:center}
.trail[hidden]{display:none}.trail .chip,.trail .btn{flex:none}.trail .chip.cur{background:var(--accent);color:var(--accent-ink)}
.wrow{padding:8px 0;border-bottom:1px solid var(--line)}
#hl div.pin{pointer-events:auto;cursor:pointer;background:#e8590c;color:#fff;outline:none;border-radius:10px;padding:2px 8px;font:700 12px system-ui;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,calc(-100% - 8px));box-shadow:0 1px 4px rgba(0,0,0,.45)}
#hl div.pin.ok{background:#2a9d5c}#hl div.pin.ng{background:#d62828}
#split{position:fixed;top:0;left:50%;width:50%;height:100%;border:0;border-left:3px solid var(--accent);z-index:21;background:var(--viewer-bg)}
body.splitting #viewer{right:50%}
body.pane header,body.pane main{display:none}
.lvhead{font-size:13px;font-weight:700;color:var(--sub);margin:14px 2px 6px;letter-spacing:.02em}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
/* viewer */
#viewer{position:fixed;inset:0;z-index:20;background:var(--viewer-bg);display:none;flex-direction:column}
#viewer.open{display:flex}
.vbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vbar .title{flex:1;min-width:120px;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar input{width:64px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center}
.vfind{display:flex;gap:6px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.vfind input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#hl div.ocrbox{pointer-events:auto;cursor:pointer}
#stage{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
#pagewrap{position:relative;margin:10px auto;box-shadow:0 2px 12px rgba(0,0,0,.4);background:#fff;transform-origin:0 0}
#pagewrap canvas{display:block}
#hl{position:absolute;inset:0;pointer-events:none}
#hl div{position:absolute;background:rgba(255,200,0,.42);outline:2px solid rgba(230,120,0,.9);border-radius:2px}
#hl div.exact{background:rgba(30,110,255,.28);outline:3px solid rgba(20,90,230,.95)}
#hl div.ocrbox{background:rgba(120,120,120,.08);outline:1px dashed rgba(90,90,90,.8)}
#hl div.xref{pointer-events:auto;cursor:pointer;background:rgba(0,170,90,.14);outline:2px solid rgba(0,150,80,.85)}
#hl div.zone{background:rgba(150,60,230,.10);outline:3px dashed rgba(130,40,220,.9);border-radius:0}
#hl div.zone::after{content:attr(data-label);position:absolute;left:0;top:-22px;background:rgba(130,40,220,.95);color:#fff;font:700 13px system-ui;padding:2px 6px;border-radius:4px;white-space:nowrap}
.chip.ref{background:rgba(0,150,80,.14);color:inherit}.chip.ref.none{opacity:.5}
.ocrbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.ocrbar .in{max-width:900px;margin:0 auto}
#blackout{position:fixed;inset:0;z-index:60;background:#000;color:#555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-size:14px}
#blackout[hidden]{display:none}
.bohint{color:#333;font-size:12px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 0;cursor:pointer}
.opt input{margin-top:4px}
.vfoot{background:var(--card);border-top:1px solid var(--line);padding:8px 10px;max-height:40vh;overflow:auto}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .panel{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222a;backdrop-filter:blur(4px);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;display:none;max-width:90vw;text-align:center}
.lock{font-size:12px;color:var(--sub);display:flex;gap:4px;align-items:center}
</style>

<body>
<header>
  <div class="top">
    <h1>🚄 KTX 도면 찾기</h1>

  </div>
  <form class="searchbox" id="sform" autocomplete="off">
    <input id="q" type="search" placeholder="장치명, 회로번호, 고장 증상, 도면번호…" enterkeyhint="search">

<!--PDFJS-->
<script>
"use strict";
/* ---------- storage (IndexedDB, 이 기기 안에서만) ---------- */
const DB_NAME = "ktx-dwg", DB_VER = 3;
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = r.result;
      if (e.oldVersion < 1){
        d.createObjectStore("files", {keyPath: "id"});        // 메타데이터
        d.createObjectStore("blobs");                          // PDF 원본 (key = file id)
        const p = d.createObjectStore("pages", {keyPath: ["fileId", "page"]});
        p.createIndex("fileId", "fileId");
        const t = d.createObjectStore("tags", {keyPath: "id"});
        t.createIndex("fileId", "fileId");
      }
      if (e.oldVersion < 2){
        d.createObjectStore("cases", {keyPath: "id"});   // 고장 이력
        d.createObjectStore("checks", {keyPath: "id"});  // 점검 순서 (증상별 단계)
        d.createObjectStore("runs", {keyPath: "id"});    // 점검 순서를 실제로 해 본 기록
      }
      if (e.oldVersion < 3) d.createObjectStore("pins", {keyPath: "id"});  // 도면 위 측정 메모
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(stores, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(stores, mode);
    let out;
    Promise.resolve(fn(t)).then(v => out = v);
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = (store) => tx([store], "readonly", t => req(t.objectStore(store).getAll()));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- in-memory index ---------- */
let FILES = [], PAGES = [], TAGS = [], CASES = [], CHECKS = [], RUNS = [], PINS = [];
async function loadAll(){
  [FILES, PAGES, TAGS, CASES, CHECKS, RUNS, PINS] = await Promise.all(["files", "pages", "tags", "cases", "checks", "runs", "pins"].map(getAll));
  FILES.sort((a, b) => a.name.localeCompare(b.name, "ko", {numeric: true}));
  for (const p of PAGES){ p.norm = norm(p.text); p.onorm = p.ocr ? norm(p.ocr.text) : ""; p.oskel = skel(p.onorm); p.words = null; }
}
const fileById = id => FILES.find(f => f.id === id);
const tagsOf = (fileId, page) => TAGS.filter(t => t.fileId === fileId && t.page === page);

/* ---------- text helpers ---------- */
const norm = s => (s || "").toLowerCase().normalize("NFC").replace(/[\s\-_·.,/()\[\]]+/g, "");
const esc = s => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 인식기가 자주 헷갈리는 글자(B/8, O/Q/0, I/1, S/5, Z/2, G/6)를 같게 본 형태. 숫자가 든 검색어에만 쓴다 */
const skel = s => s.replace(/[oq]/g, "0").replace(/[il|]/g, "1").replace(/b/g, "8").replace(/s/g, "5").replace(/z/g, "2").replace(/g/g, "6");
const ocrHas = (onorm, oskel, tk) => !!onorm && (onorm.includes(tk) || (/\d/.test(tk) && oskel.includes(skel(tk))));
function tokens(q){ return q.split(/\s+/).map(norm).filter(Boolean); }

function snippet(text, toks){
  // 원문에서 첫 번째 일치 위치 주변을 잘라 보여준다 (공백 무시 매칭)
  const map = []; let n = "";
  const low = text.toLowerCase().normalize("NFC");
  for (let i = 0; i < low.length; i++){
    if (!/[\s\-_·.,/()\[\]]/.test(low[i])){ n += low[i]; map.push(i); }
  }
  const ranges = [];
  for (const tk of toks){
    let from = 0, k;
    while ((k = n.indexOf(tk, from)) !== -1 && ranges.length < 40){
      ranges.push([map[k], map[k + tk.length - 1] + 1]); from = k + tk.length;
    }
  }
  if (!ranges.length) return esc(text.slice(0, 120));
  ranges.sort((a, b) => a[0] - b[0]);
  const start = Math.max(0, ranges[0][0] - 50), end = Math.min(text.length, ranges[0][1] + 90);
  let out = "", pos = start;
  for (const [a, b] of ranges){
    if (b <= pos || a >= end) continue;
    const aa = Math.max(a, pos);
    out += esc(text.slice(pos, aa)) + "<mark>" + esc(text.slice(aa, Math.min(b, end))) + "</mark>";
    pos = Math.min(b, end);
  }
  out += esc(text.slice(pos, end));
  return (start > 0 ? "…" : "") + out + (end < text.length ? "…" : "");
}

/* ---------- search ---------- */
// 쪽 안의 낱말 목록 (정확히 일치 판단용). 쉼표·공백으로 나눈 한 덩어리가 검색어와 똑같으면 "정확히 일치"
const splitWords = s => (s || "").split(/[\s,;]+/).map(norm).filter(Boolean);
function pageWords(p){
  if (!p.words) p.words = new Set([...splitWords(p.text), ...(p.ocr ? p.ocr.words.flatMap(w => splitWords(w.t)) : [])]);
  return p.words;
}
const LEVEL = {exact: 3, part: 2, similar: 1};
function search(q){
  const toks = tokens(q);
  if (!toks.length) return [];
  const results = new Map();  // key fileId|page
  const add = (fileId, page, score, src) => {
    const k = fileId + "|" + page;
    const r = results.get(k) || {fileId, page, score: 0, src: new Set()};
    r.score += score; r.src.add(src); results.set(k, r);
  };
  // 페이지마다: 모든 검색어가 (본문 + 태그 + 파일명) 어딘가에 있어야 함
  const tagText = new Map();
  for (const t of TAGS){
    const k = t.fileId + "|" + t.page;
    tagText.set(k, (tagText.get(k) || "") + " " + norm(t.label + " " + (t.note || "")));
  }
  for (const p of PAGES){
    const f = fileById(p.fileId); if (!f) continue;
    const k = p.fileId + "|" + p.page;
    const tt = tagText.get(k) || "", fn = norm(f.name + " " + (f.memo || ""));
    let ok = true, score = 0, level = LEVEL.exact;
    for (const tk of toks){
      const inTag = tt.includes(tk), inBody = p.norm.includes(tk) || ocrHas(p.onorm, p.oskel, tk), inName = fn.includes(tk);
      if (!inTag && !inBody && !inName){ ok = false; break; }
      // 이 검색어가 얼마나 똑같이 들어 있나: 낱말 하나와 똑같음 > 글자 그대로 일부 > 헷갈리는 글자를 같게 봐야 맞음
      const tagExact = TAGS.some(t => t.fileId === p.fileId && t.page === p.page && (norm(t.label) === tk || splitWords(t.label).includes(tk)));
      const lv = pageWords(p).has(tk) || tagExact ? LEVEL.exact : (inTag || inName || p.norm.includes(tk) || p.onorm.includes(tk)) ? LEVEL.part : LEVEL.similar;
      level = Math.min(level, lv);
      score += (inTag ? 10 : 0) + (inBody ? 3 + Math.min(5, p.norm.split(tk).length - 1) : 0) + (inName ? 1 : 0);
    }
    if (!ok) continue;
    // 파일명만 일치하는 경우 모든 페이지가 뜨지 않게, 첫 페이지로만
    const onlyName = toks.every(tk => !tt.includes(tk) && !p.norm.includes(tk) && !ocrHas(p.onorm, p.oskel, tk));
    if (onlyName && p.page !== 1) continue;
    add(p.fileId, p.page, score, tt && toks.some(tk => tt.includes(tk)) ? "tag" : onlyName ? "name" : "body");
    results.get(k).level = onlyName ? LEVEL.part : level;
  }
  // 정확히 일치하는 쪽을 먼저, 그다음 일부 일치, 마지막에 비슷한 글자
  return [...results.values()].sort((a, b) => b.level - a.level || b.score - a.score || fileById(a.fileId).name.localeCompare(fileById(b.fileId).name, "ko", {numeric: true}) || a.page - b.page);
}

/* ---------- UI: tabs ---------- */
const $ = s => document.querySelector(s);
let curTab = "search", lastQuery = "";
function setTab(name){
  curTab = name;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  for (const s of ["search", "tags", "files", "fault", "settings"]) $("#tab-" + s).hidden = s !== name;
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
function render(){
  if (curTab === "search") renderSearch();
  if (curTab === "tags") renderTags();
  if (curTab === "files") renderFiles();
  if (curTab === "fault") renderFault();
  if (curTab === "settings") renderSettings();
}
function toast(msg, ms = 2200){
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", ms);
}

}

function renderSearch(){
  const el = $("#tab-search");
  if (!FILES.length){
    el.innerHTML = `<div class="empty">아직 등록된 도면이 없습니다.<br>PDF 도면을 등록하면 도면 안의 글자로 검색할 수 있어요.<br><br>

  }
  const rc = recent();
  let html = rc.length ? `<div class="muted">최근 검색</div><div class="recent">${rc.map(r => `<span class="chip x" data-q="${esc(r)}">${esc(r)}</span>`).join("")}</div>` : "";
  if (!lastQuery){
    html += `<div class="empty">검색어를 입력하세요.<br><span class="muted">예: 견인전동기, ATC, 회로번호 3142, 팬토그래프 상승불가<br>여러 단어를 띄어 쓰면 모두 포함된 페이지만 찾아요.</span></div>`;
  } else {

    // 같은 증상의 지난 고장 사례와 점검 순서를 도면보다 먼저 보여준다
    const pc = findCases(lastQuery), pk = findChecks(lastQuery);
    if (pc.length || pk.length){
      html += `<div class="lvhead">지난 고장 사례${pc.length ? ` ${pc.length}건` : ""}${pk.length ? ` · 점검 순서 ${pk.length}개` : ""}</div>`;
      html += pk.map(c => `<div class="card"><div class="row"><b class="grow">✅ ${esc(c.title)}</b><span class="muted">${c.steps.length}단계</span><button class="btn sm primary" data-start="${c.id}">점검 시작</button></div></div>`).join("");
      html += pc.slice(0, 3).map(caseCard).join("");
      if (pc.length > 3) html += `<button class="btn sm" id="moreCases">고장 사례 ${pc.length - 3}건 더 보기</button>`;
      html += `<div class="lvhead">도면</div>`;
    }
    const cnt = lv => rs.filter(r => r.level === lv).length;
    html += `<div class="muted" style="margin-bottom:8px">“${esc(lastQuery)}” 결과 ${rs.length}건 · 정확히 일치 ${cnt(LEVEL.exact)} · 일부 일치 ${cnt(LEVEL.part)}${cnt(LEVEL.similar) ? ` · 비슷한 글자 ${cnt(LEVEL.similar)}` : ""}</div>`;
    let prevLevel = null;
    if (!rs.length && (pc.length || pk.length)) html += `<div class="muted">이 검색어가 들어간 도면은 없어요.</div>`;
    else if (!rs.length) html += `<div class="empty">찾는 내용이 없습니다.<br><span class="muted">띄어쓰기를 줄이거나 다른 이름(약어, 영문)으로 검색해 보세요.<br>스캔본 도면은 글자가 없으니 페이지에 태그를 붙여 주세요.</span></div>`;
    for (const r of rs.slice(0, 200)){
      if (r.level !== prevLevel){
        html += `<div class="lvhead">${r.level === LEVEL.exact ? "정확히 일치" : r.level === LEVEL.part ? "일부 일치 (검색어가 더 긴 이름의 일부)" : "비슷한 글자 (인식 오차일 수 있음: B/8, O/0, I/1 등)"}</div>`;
        prevLevel = r.level;
      }
      const f = fileById(r.fileId), p = PAGES.find(x => x.fileId === r.fileId && x.page === r.page);
      const tg = tagsOf(r.fileId, r.page);
      html += `<div class="card result" data-f="${r.fileId}" data-p="${r.page}">
        <div class="t"><span class="fname">${esc(f.name)}</span><span class="pg">${r.page}쪽</span>${r.src.has("tag") ? '<span class="chip">태그 일치</span>' : ""}</div>
        ${tg.length ? `<div class="chips">${tg.map(t => `<span class="chip">${esc(t.label)}</span>`).join("")}</div>` : ""}
        ${p && p.text && toks.some(tk => p.norm.includes(tk)) ? `<div class="snip">${snippet(p.text, toks)}</div>` : p && p.ocr && toks.some(tk => ocrHas(p.onorm, p.oskel, tk)) ? `<div class="snip"><span class="chip">글자 인식</span> ${snippet(p.ocr.text, toks)}</div>` : p && p.text ? `<div class="snip">${snippet(p.text, toks)}</div>` : ""}
      </div>`;
    }
    if (rs.length > 200) html += `<div class="muted">상위 200건만 표시합니다. 검색어를 더 구체적으로 입력해 보세요.</div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".recent .chip").forEach(c => c.onclick = () => { $("#q").value = c.dataset.q; lastQuery = c.dataset.q; pushRecent(lastQuery); renderSearch(); });
  el.querySelectorAll(".result[data-f]").forEach(c => c.onclick = () => openViewer(c.dataset.f, +c.dataset.p, lastQuery));
  bindCases(el);
  el.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startRun(CHECKS.find(c => c.id === b.dataset.start)));
  if ($("#moreCases")) $("#moreCases").onclick = () => { FT.q = lastQuery; FT.seg = "cases"; FT.runId = null; setTab("fault"); };
}

/* ---------- backup / restore (tags only) ---------- */
function backup(withOcr){
  const data = {app: "ktx-dwg", ver: 1, at: new Date().toISOString(),
    files: FILES.map(f => ({hash: f.hash, name: f.name, memo: f.memo || "", pages: f.pages})),
    tags: TAGS.map(t => ({hash: fileById(t.fileId)?.hash, page: t.page, label: t.label, note: t.note || ""})),
    // 고장 기록과 점검 순서: 도면 연결은 기기마다 다른 id 대신 PDF 지문(hash)으로 담는다
    cases: CASES.map(c => ({...c, links: (c.links || []).map(linkOut)})),
    checks: CHECKS.map(c => ({...c, steps: c.steps.map(st => ({...st, link: st.link && linkOut(st.link)}))})),
    runs: RUNS,
    pins: PINS.map(p => { const {fileId, ...rest} = p; return {...rest, ...linkOut(p)}; })};
  // 글자 인식 결과도 담으면 PC에서 인식한 걸 탭으로 옮길 수 있다 (같은 PDF를 양쪽에 등록해 두어야 함)
  if (withOcr) data.ocr = PAGES.filter(p => p.ocr).map(p => ({hash: fileById(p.fileId)?.hash, page: p.page, words: p.ocr.words, mode: p.ocr.mode, q: p.ocr.q}));
  const name = (withOcr ? "KTX도면_태그·고장기록+인식결과백업_" : "KTX도면_태그·고장기록백업_") + new Date().toISOString().slice(0, 10) + ".json";
  const text = JSON.stringify(data, null, 1);
  if (window.AndroidBridge && AndroidBridge.saveText){ AndroidBridge.saveText(name, text); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("#restorePicker").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "ktx-dwg") throw new Error("형식이 다릅니다");
    const byHash = new Map(FILES.map(f => [f.hash, f]));
    let added = 0, skipped = 0, ocrPages = 0, faults = 0;
    await tx(["files", "tags", "pages", "cases", "checks", "runs", "pins"], "readwrite", async t => {
      // 고장 기록·점검 순서·점검 기록: 같은 id가 이미 있으면 그대로 둔다 (같은 백업을 두 번 복원해도 겹치지 않게)
      const linkIn = l => { const f = byHash.get(l.hash); return {fileId: f ? f.id : null, hash: l.hash, name: l.name, page: l.page}; };
      for (const c of data.cases || []) if (!CASES.some(x => x.id === c.id)){ t.objectStore("cases").put({...c, links: (c.links || []).map(linkIn)}); faults++; }
      for (const c of data.checks || []) if (!CHECKS.some(x => x.id === c.id)){ t.objectStore("checks").put({...c, steps: c.steps.map(st => ({...st, link: st.link && linkIn(st.link)}))}); faults++; }
      for (const r of data.runs || []) if (!RUNS.some(x => x.id === r.id)) t.objectStore("runs").put(r);
      for (const p of data.pins || []) if (!PINS.some(x => x.id === p.id)){ t.objectStore("pins").put({...p, ...linkIn(p)}); faults++; }
      for (const bf of data.files || []){
        const f = byHash.get(bf.hash);
        if (f && bf.memo && !f.memo){ f.memo = bf.memo; t.objectStore("files").put(stripFile(f)); }
      }
      for (const bt of data.tags || []){
        const f = byHash.get(bt.hash);
        if (!f){ skipped++; continue; }
        if (TAGS.some(x => x.fileId === f.id && x.page === bt.page && x.label === bt.label)) continue;
        t.objectStore("tags").put({id: uid(), fileId: f.id, page: bt.page, label: bt.label, note: bt.note || ""}); added++;
      }
      // 인식 결과는 기존 결과에 더한다
      for (const bo of data.ocr || []){
        const f = byHash.get(bo.hash); if (!f || !Array.isArray(bo.words)) continue;
        const st = t.objectStore("pages"), rec = await req(st.get([f.id, bo.page]));
        if (!rec) continue;
        const words = rec.ocr ? unionWords(rec.ocr.words, bo.words) : bo.words;
        rec.ocr = {words, text: words.map(w => w.t).join(" "), at: Date.now(), mode: bo.mode, q: bo.q, runs: (rec.ocr?.runs || 0) + 1};
        st.put(rec); ocrPages++;
      }
    });
    await loadAll(); render();
    toast(`태그 ${added}개${faults ? ` · 고장 기록·점검 순서 ${faults}개` : ""}${ocrPages ? ` · 글자 인식 결과 ${ocrPages}쪽` : ""} 복원${skipped ? ` · 해당 PDF가 없어 태그 ${skipped}개 건너뜀` : ""}`, 4000);
  } catch (err){ toast("복원 실패: " + err.message, 3500); }
};

async function sha(buf){
  if (crypto.subtle){
    const h = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(h)].slice(0, 16).map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let h = 2166136261; const u = new Uint8Array(buf);
  for (let i = 0; i < u.length; i += 7) h = Math.imul(h ^ u[i], 16777619);
  return "f" + (h >>> 0).toString(16) + u.length;
}
function pageText(content){
  let s = "";
  for (const it of content.items){ if ("str" in it){ s += it.str; s += it.hasEOL ? "\n" : " "; } }
  return s.replace(/[ \t]+/g, " ").trim();
}
$("#picker").onchange = async e => {
  const list = [...e.target.files]; e.target.value = "";
  if (!list.length) return;
  setTab("files");
  const pdfjs = await getPdfjs();
  let ok = 0;
  for (let i = 0; i < list.length; i++){
    const file = list[i];
    importing = {label: `(${i + 1}/${list.length}) ${file.name} 읽는 중…`, pct: 0}; showImport();
    try {
      const buf = await file.arrayBuffer();
      const hash = await sha(buf);
      if (FILES.some(f => f.hash === hash)){ toast(`이미 등록된 도면: ${file.name}`); continue; }
      const doc = await pdfjs.getDocument({data: new Uint8Array(buf.slice(0))}).promise;
      const id = uid(), pages = [];
      let textPages = 0;
      for (let p = 1; p <= doc.numPages; p++){
        const pg = await doc.getPage(p);
        const text = pageText(await pg.getTextContent());
        if (text.replace(/\s/g, "").length > 15) textPages++;
        pages.push({fileId: id, page: p, text});
        pg.cleanup();
        importing.label = `(${i + 1}/${list.length}) ${file.name} · ${p}/${doc.numPages}쪽 글자 추출 중`;
        importing.pct = p / doc.numPages; if (p % 3 === 0 || p === doc.numPages) showImport();
      }
      await doc.destroy();
      const meta = {id, name: file.name.replace(/\.pdf$/i, ""), memo: "", size: file.size, pages: pages.length, textPages, addedAt: Date.now(), hash};
      await tx(["files", "blobs", "pages"], "readwrite", t => {
        t.objectStore("files").put(meta);
        t.objectStore("blobs").put(new Blob([buf], {type: "application/pdf"}), id);
        for (const p of pages) t.objectStore("pages").put(p);
      });
      ok++;
    } catch (err){
      console.error(err);
      toast(`${file.name}: 읽을 수 없는 PDF입니다 (${err.message})`, 4000);
    }
  }
  importing = null;
  await loadAll(); render();
  if (ok) toast(`도면 ${ok}개 등록 완료`);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
};

/* ---------- 고장 이력과 점검 순서 (이 기기 안에만 저장) ---------- */
const FT = {seg: "cases", q: "", runId: null};
const ymd = t => new Date(t).toLocaleDateString("sv");  // 2026-10-27 형식, 기기 시간대 기준
/* 도면 연결: 이 기기의 도면 id와 함께 PDF 지문(hash)과 이름을 적어 두어, 백업을 다른 기기에 복원해도 이어지게 한다 */
const linkFile = l => l && (fileById(l.fileId) || (l.hash && FILES.find(f => f.hash === l.hash)));
const mkLink = (fileId, page) => { const f = fileById(fileId); return {fileId, hash: f.hash, name: f.name, page}; };
const linkOut = l => { const f = linkFile(l); return {hash: f ? f.hash : l.hash, name: f ? f.name : l.name, page: l.page}; };
function linkChip(l, attrs = ""){
  const f = linkFile(l);
  return f ? `<span class="chip x" data-lf="${f.id}" data-lp="${l.page}" ${attrs}>📄 ${esc(f.name)} · ${l.page}쪽</span>`
    : `<span class="chip" style="opacity:.6" title="이 기기에 등록되지 않은 도면" ${attrs}>📄 ${esc(l.name || "없는 도면")} · ${l.page}쪽 (미등록)</span>`;
}
const bindLinks = el => el.querySelectorAll("[data-lf]").forEach(c => c.onclick = e => { e.stopPropagation(); openViewer(c.dataset.lf, +c.dataset.lp, ""); });
/* 도면 쪽 고르기: 파일 목록 + 쪽 번호. 지금(또는 마지막으로) 보던 도면을 먼저 골라 둔다 */
// l: 이미 연결된 쪽, null이면 연결 없음, 생략하면 지금(또는 마지막으로) 보던 도면
function pickerHtml(id, l){
  const cur = l ? linkFile(l)?.id : l === null ? null : V.fileId;
  return `<select class="t" id="${id}F" style="flex:2;min-width:0"><option value="">도면 연결 안 함</option>${FILES.map(f => `<option value="${f.id}" ${f.id === cur ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select>
    <input class="t" id="${id}P" inputmode="numeric" placeholder="쪽" style="width:64px" value="${l ? l.page : cur ? V.page : ""}">`;
}
function pickerRead(id){
  const f = $("#" + id + "F").value; if (!f) return null;
  const pages = fileById(f).pages, p = Math.max(1, Math.min(pages, parseInt($("#" + id + "P").value, 10) || 1));
  return mkLink(f, p);
}

/* 비슷한 지난 사례: 검색어 낱말이 증상에 있으면 2점, 원인·조치·메모·편성에 있으면 1점 */
function findCases(q, exceptId){
  const toks = tokens(q); if (!toks.length) return [];
  return CASES.filter(c => c.id !== exceptId).map(c => {
    const sym = norm(c.symptom), all = norm([c.symptom, c.cause, c.action, c.memo, c.car].join(" "));
    return {c, score: toks.reduce((n, tk) => n + (sym.includes(tk) ? 2 : all.includes(tk) ? 1 : 0), 0)};
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score || (b.c.date || "").localeCompare(a.c.date || "")).map(x => x.c);
}
const findChecks = q => { const toks = tokens(q); return toks.length ? CHECKS.filter(c => toks.some(tk => norm(c.title).includes(tk))) : []; };
const byDate = (a, b) => (b.date || "").localeCompare(a.date || "") || (b.at || 0) - (a.at || 0);
function caseCard(c){
  return `<div class="card result" data-case="${c.id}">
    <div class="row"><b class="grow">🛠 ${esc(c.symptom || "(증상 없음)")}</b><span class="muted">${esc(c.date || "")}${c.car ? " · " + esc(c.car) : ""}</span></div>
    ${c.cause ? `<div class="snip pre"><b>원인</b> ${esc(c.cause)}</div>` : ""}${c.action ? `<div class="snip pre"><b>조치</b> ${esc(c.action)}</div>` : ""}
    ${c.memo ? `<div class="snip pre">${esc(c.memo)}</div>` : ""}
    ${(c.links || []).length ? `<div class="chips">${c.links.map(l => linkChip(l)).join("")}</div>` : ""}</div>`;
}
const bindCases = el => { el.querySelectorAll("[data-case]").forEach(c => c.onclick = () => caseEditor(CASES.find(x => x.id === c.dataset.case))); bindLinks(el); };

function renderFault(){
  const el = $("#tab-fault");
  const run = FT.runId && RUNS.find(r => r.id === FT.runId);
  if (run) return renderRun(el, run);
  let html = `<div class="seg"><button data-seg="cases" class="${FT.seg === "cases" ? "on" : ""}">고장 이력 ${CASES.length}</button><button data-seg="checks" class="${FT.seg === "checks" ? "on" : ""}">점검 순서 ${CHECKS.length}</button></div>`;
  if (FT.seg === "cases"){
    html += `<form class="row" id="caseFind" style="margin:10px 0" autocomplete="off"><input class="t grow" id="caseQ" type="search" placeholder="증상·원인·편성으로 찾기" value="${esc(FT.q)}" enterkeyhint="search"><button class="btn primary" type="button" id="caseNew">＋ 고장 기록</button></form>`;
    const list = FT.q ? findCases(FT.q) : CASES.slice().sort(byDate);
    html += list.length ? list.map(caseCard).join("") : `<div class="empty">${FT.q ? "맞는 기록이 없어요." : `아직 고장 기록이 없어요.<br><span class="muted">고장 증상, 원인, 조치와 관련 도면 쪽을 적어 두면<br>같은 증상을 검색할 때 지난 사례가 함께 나와요.<br>도면을 보다가 아래쪽 <b>＋ 고장 기록</b>을 눌러도 돼요.</span>`}</div>`;
  } else {
    html += `<div class="row" style="margin:10px 0"><span class="muted grow">증상별 점검 순서를 만들어 두고 현장에서 하나씩 체크해요</span><button class="btn primary" id="checkNew">＋ 점검 순서</button></div>`;
    const open = RUNS.filter(r => !r.done).sort((a, b) => b.at - a.at);
    if (open.length) html += `<div class="lvhead">진행 중인 점검</div>` + open.map(r => `<div class="card result" data-run="${r.id}"><b>▶ ${esc(r.title)}</b> <span class="muted">${r.car ? esc(r.car) + " · " : ""}${ymd(r.at)} · ${r.steps.filter(s => r.res[s.id]?.ok != null).length}/${r.steps.length}단계</span></div>`).join("") + `<div class="lvhead">점검 순서</div>`;
    const cs = CHECKS.slice().sort((a, b) => a.title.localeCompare(b.title, "ko", {numeric: true}));
    html += cs.map(c => {
      const done = RUNS.filter(r => r.checkId === c.id && r.done).sort((a, b) => b.at - a.at);
      return `<div class="card"><div class="row"><div class="grow"><b>${esc(c.title)}</b><div class="muted">${c.steps.length}단계${done.length ? ` · 점검 ${done.length}번` : ""}</div></div>
        <button class="btn sm primary" data-start="${c.id}">점검 시작</button><button class="btn sm" data-cedit="${c.id}">편집</button></div>
        ${done.length ? `<div class="chips"><span class="muted">지난 점검</span> ${done.slice(0, 6).map(r => `<span class="chip x" data-run="${r.id}">${ymd(r.at)}${r.car ? " " + esc(r.car) : ""}${r.steps.some(s => r.res[s.id]?.ok === false) ? " ⚠" : ""}</span>`).join("")}</div>` : ""}</div>`;
    }).join("") || `<div class="empty">아직 점검 순서가 없어요.<br><span class="muted">예: “팬토 상승 불가” → 1. 제어전원 확인 → 2. R-PT-01 동작 확인 → 3. 12B47 전압 측정<br>단계마다 기준값과 도면 쪽을 넣어 둘 수 있어요.</span></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll("[data-seg]").forEach(b => b.onclick = () => { FT.seg = b.dataset.seg; renderFault(); });
  if ($("#caseNew")){
    $("#caseNew").onclick = () => caseEditor(null, FT.q ? {symptom: FT.q} : {});
    $("#caseFind").onsubmit = e => { e.preventDefault(); FT.q = $("#caseQ").value.trim(); $("#caseQ").blur(); renderFault(); };
    $("#caseQ").onsearch = () => { if (!$("#caseQ").value){ FT.q = ""; renderFault(); } };
  }
  if ($("#checkNew")) $("#checkNew").onclick = () => checkEditor(null);
  el.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startRun(CHECKS.find(c => c.id === b.dataset.start)));
  el.querySelectorAll("[data-cedit]").forEach(b => b.onclick = () => checkEditor(CHECKS.find(c => c.id === b.dataset.cedit)));
  el.querySelectorAll("[data-run]").forEach(b => b.onclick = () => { FT.runId = b.dataset.run; renderFault(); window.scrollTo(0, 0); });
  bindCases(el);
}

/* ---- 고장 기록 편집 ---- */
function caseEditor(c, init = {}){
  const w = c ? {...c, links: (c.links || []).slice()} : {date: ymd(Date.now()), car: "", symptom: "", cause: "", action: "", memo: "", links: [], ...init};
  const symptoms = [...new Set([...CASES.map(x => x.symptom), ...CHECKS.map(x => x.title)].filter(Boolean))];
  const draw = () => {
    openSheet(`<h3 style="margin-top:0">${c ? "고장 기록 수정" : "고장 기록"}</h3>
      <div class="row"><div class="grow"><label class="f">날짜</label><input class="t" id="cDate" type="date" value="${esc(w.date)}"></div>
        <div class="grow"><label class="f">편성·차량</label><input class="t" id="cCar" value="${esc(w.car)}" placeholder="예: 12편성 M1"></div></div>
      <label class="f">고장 증상</label><input class="t" id="cSym" list="symList" value="${esc(w.symptom)}" placeholder="예: 팬토그래프 상승 불가">
      <datalist id="symList">${symptoms.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
      <div id="cSimilar"></div>
      <label class="f">원인</label><textarea class="t" id="cCause" rows="2" placeholder="예: R-PT-01 접점 불량">${esc(w.cause)}</textarea>
      <label class="f">조치</label><textarea class="t" id="cAction" rows="2" placeholder="예: R-PT-01 교체 후 정상">${esc(w.action)}</textarea>
      <label class="f">메모 (측정값, 참고 사항)</label><textarea class="t" id="cMemo" rows="2">${esc(w.memo)}</textarea>
      <label class="f">관련 도면 쪽</label>
      <div class="chips" id="cLinks">${w.links.map((l, i) => `${linkChip(l, `data-li="${i}"`).replace("</span>", ' <b data-rm="' + i + '" style="cursor:pointer">✕</b></span>')}`).join("") || '<span class="muted">없음</span>'}</div>
      <div class="row" style="margin-top:6px">${pickerHtml("cPick")}<button class="btn sm" id="cAddLink">＋ 연결</button></div>
      <div class="row" style="margin-top:16px">${c ? '<button class="btn danger" id="cDel">삭제</button>' : ""}<span class="grow"></span>
        <button class="btn" id="cCancel">취소</button><button class="btn primary" id="cSave">저장</button></div>`, !!draw.again);
    draw.again = true;
    const showSimilar = () => {
      const sim = findCases($("#cSym").value, c && c.id).slice(0, 3);
      $("#cSimilar").innerHTML = sim.length ? `<div class="warn" style="line-height:1.5"><b>비슷한 지난 사례</b>${sim.map(x => `<div>· ${esc(x.date || "")} ${esc(x.symptom)}${x.cause ? " → " + esc(x.cause) : ""}${x.action ? " / " + esc(x.action) : ""}</div>`).join("")}</div>` : "";
    };
    $("#cSym").oninput = showSimilar; showSimilar();
    $("#cLinks").querySelectorAll("[data-rm]").forEach(b => b.onclick = e => { e.stopPropagation(); read(); w.links.splice(+b.dataset.rm, 1); draw(); });
    $("#cAddLink").onclick = () => { read(); const l = pickerRead("cPick"); if (!l) return toast("연결할 도면을 고르세요"); w.links.push(l); draw(); };
    $("#cCancel").onclick = () => history.back();
    $("#cSave").onclick = async () => {
      read();
      if (!w.symptom.trim()){ $("#cSym").focus(); return toast("고장 증상을 적어 주세요"); }
      const rec = {...w, id: c ? c.id : uid(), at: c ? c.at : Date.now(), updated: Date.now()};
      await tx(["cases"], "readwrite", t => t.objectStore("cases").put(rec));
      await loadAll(); history.back(); afterFaultChange(); toast("고장 기록을 저장했습니다");
    };
    if (c) $("#cDel").onclick = async () => {
      if (!confirm("이 고장 기록을 삭제할까요?")) return;
      await tx(["cases"], "readwrite", t => t.objectStore("cases").delete(c.id));
      await loadAll(); history.back(); afterFaultChange();

}
function afterFaultChange(){ if ($("#viewer").classList.contains("open")) renderFoot(); else render(); }

/* ---- 점검 순서 편집 ---- */
function checkEditor(c){
  const w = c ? {...c, steps: c.steps.map(s => ({...s}))} : {title: "", steps: [{id: uid(), text: "", expect: "", link: null}]};
  const draw = () => {
    openSheet(`<h3 style="margin-top:0">${c ? "점검 순서 수정" : "점검 순서 만들기"}</h3>
      <label class="f">고장 증상 (점검 순서 이름)</label><input class="t" id="kTitle" value="${esc(w.title)}" placeholder="예: 팬토그래프 상승 불가">
      ${w.steps.map((s, i) => `<div class="card" style="margin-top:10px">
        <div class="row"><b>${i + 1}단계</b><span class="grow"></span>
          <button class="btn sm" data-up="${i}" ${i ? "" : "disabled"}>↑</button><button class="btn sm" data-down="${i}" ${i < w.steps.length - 1 ? "" : "disabled"}>↓</button><button class="btn sm danger" data-del="${i}">✕</button></div>
        <textarea class="t" data-k="text" data-i="${i}" rows="2" placeholder="점검할 것 (예: R-PT-01 코일 전압 측정)" style="margin-top:6px">${esc(s.text)}</textarea>
        <input class="t" data-k="expect" data-i="${i}" value="${esc(s.expect || "")}" placeholder="기준값 (예: DC 100V, 선택)" style="margin-top:6px">
        <div class="row" style="margin-top:6px">${pickerHtml("kp" + i, s.link || null)}</div></div>`).join("")}
      <div class="row" style="margin-top:10px"><button class="btn" id="kAdd">＋ 단계 추가</button></div>
      <div class="row" style="margin-top:16px">${c ? '<button class="btn danger" id="kDelAll">삭제</button>' : ""}<span class="grow"></span>
        <button class="btn" id="kCancel">취소</button><button class="btn primary" id="kSave">저장</button></div>`, !!draw.again);
    draw.again = true;
    const move = (i, j) => { read(); [w.steps[i], w.steps[j]] = [w.steps[j], w.steps[i]]; draw(); };
    $("#sheetPanel").querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
    $("#sheetPanel").querySelectorAll("[data-down]").forEach(b => b.onclick = () => move(+b.dataset.down, +b.dataset.down + 1));
    $("#sheetPanel").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { read(); w.steps.splice(+b.dataset.del, 1); draw(); });
    $("#kAdd").onclick = () => { read(); w.steps.push({id: uid(), text: "", expect: "", link: null}); draw(); setTimeout(() => $(`[data-k=text][data-i="${w.steps.length - 1}"]`).focus(), 50); };
    $("#kCancel").onclick = () => history.back();
    $("#kSave").onclick = async () => {
      read();
      w.steps = w.steps.filter(s => s.text);
      if (!w.title){ $("#kTitle").focus(); return toast("이름(고장 증상)을 적어 주세요"); }
      if (!w.steps.length) return toast("단계를 하나 이상 적어 주세요");
      const rec = {...w, id: c ? c.id : uid(), at: c ? c.at : Date.now(), updated: Date.now()};
      await tx(["checks"], "readwrite", t => t.objectStore("checks").put(rec));
      await loadAll(); history.back(); FT.seg = "checks"; render(); toast("점검 순서를 저장했습니다");
    };
    if (c) $("#kDelAll").onclick = async () => {
      if (!confirm("이 점검 순서를 삭제할까요? 지난 점검 기록은 남아요.")) return;
      await tx(["checks"], "readwrite", t => t.objectStore("checks").delete(c.id));
      await loadAll(); history.back(); render();
    };
  };
  const read = () => {
    w.title = $("#kTitle").value.trim();
    $("#sheetPanel").querySelectorAll("[data-k]").forEach(x => { w.steps[+x.dataset.i][x.dataset.k] = x.value.trim(); });
    w.steps.forEach((s, i) => { s.link = pickerRead("kp" + i); });
  };
  draw();
}

/* ---- 현장 점검: 시작할 때 단계를 복사해 두어, 나중에 점검 순서를 고쳐도 지난 기록은 그대로 ---- */
async function startRun(c){
  const r = {id: uid(), checkId: c.id, title: c.title, car: "", at: Date.now(), steps: c.steps.map(s => ({...s})), res: {}, memo: "", done: false};
  await tx(["runs"], "readwrite", t => t.objectStore("runs").put(r));
  await loadAll(); FT.runId = r.id; setTab("fault"); window.scrollTo(0, 0);
}
const saveRun = r => tx(["runs"], "readwrite", t => t.objectStore("runs").put(r));
function renderRun(el, r){
  const checked = r.steps.filter(s => r.res[s.id]?.ok != null).length, bad = r.steps.filter(s => r.res[s.id]?.ok === false);
  el.innerHTML = `<div class="row" style="margin-bottom:10px"><button class="btn sm" id="runBack">← 목록</button><b class="grow">${esc(r.title)}</b><span class="muted">${ymd(r.at)}</span></div>
    <div class="row"><label class="f" style="margin:0">편성·차량</label><input class="t grow" id="runCar" value="${esc(r.car)}" placeholder="예: 12편성 M1" ${r.done ? "readonly" : ""}></div>
    <div class="muted" style="margin:10px 0">${checked}/${r.steps.length}단계 확인${bad.length ? ` · 이상 ${bad.length}` : ""}${r.done ? " · 끝난 점검" : ""}</div>
    ${r.steps.map((s, i) => { const x = r.res[s.id] || {}; return `<div class="card step ${x.ok === true ? "ok" : x.ok === false ? "ng" : ""}">
      <div class="row" style="align-items:flex-start"><b>${i + 1}.</b><div class="grow"><div class="pre">${esc(s.text)}</div>${s.expect ? `<div class="muted">기준: ${esc(s.expect)}</div>` : ""}</div></div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm ${x.ok === true ? "good" : ""}" data-ok="${s.id}" ${r.done ? "disabled" : ""}>✓ 정상</button><button class="btn sm ${x.ok === false ? "bad" : ""}" data-ng="${s.id}" ${r.done ? "disabled" : ""}>✗ 이상</button>
        <input class="t grow" data-v="${s.id}" value="${esc(x.v || "")}" placeholder="측정값" style="min-width:90px" ${r.done ? "readonly" : ""}>
        ${s.link ? linkChip(s.link) : ""}</div></div>`; }).join("")}
    ${PINS.some(p => p.runId === r.id) ? `<label class="f">도면 측정 메모</label><div class="chips">${PINS.filter(p => p.runId === r.id).map(p => { const f = linkFile(p); return f ? `<span class="chip x" data-lf="${f.id}" data-lp="${p.page}">📍 ${esc(p.text)}${p.ok === false ? " ⚠" : ""} · ${esc(shortName(f))} ${p.page}쪽</span>` : ""; }).join("")}</div>` : ""}
    <label class="f">메모</label><textarea class="t" id="runMemo" rows="2" ${r.done ? "readonly" : ""}>${esc(r.memo)}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn danger" id="runDel">삭제</button><span class="grow"></span>
      ${r.done ? '<button class="btn" id="runReopen">다시 고치기</button>' : '<button class="btn" id="runFinish">점검 끝내기</button>'}
      <button class="btn primary" id="runCase">고장 이력으로 저장</button></div>
    <div class="muted" style="margin-top:6px">적는 즉시 저장돼요. 도면을 보고 돌아와도 그대로 있어요.</div>`;
  const set = (id, ok) => { const x = r.res[id] || {}; x.ok = x.ok === ok ? null : ok; r.res[id] = x; saveRun(r); renderRun(el, r); };
  el.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => set(b.dataset.ok, true));
  el.querySelectorAll("[data-ng]").forEach(b => b.onclick = () => set(b.dataset.ng, false));
  el.querySelectorAll("[data-v]").forEach(i => i.onchange = () => { (r.res[i.dataset.v] = r.res[i.dataset.v] || {}).v = i.value.trim(); saveRun(r); });
  $("#runCar").onchange = e => { r.car = e.target.value.trim(); saveRun(r); };
  $("#runMemo").onchange = e => { r.memo = e.target.value.trim(); saveRun(r); };
  $("#runBack").onclick = () => { FT.runId = null; FT.seg = "checks"; renderFault(); };
  if ($("#runFinish")) $("#runFinish").onclick = async () => { r.done = true; await saveRun(r); renderRun(el, r); toast("점검을 끝냈습니다"); };
  if ($("#runReopen")) $("#runReopen").onclick = async () => { r.done = false; await saveRun(r); renderRun(el, r); };
  $("#runDel").onclick = async () => {
    if (!confirm("이 점검 기록을 삭제할까요?")) return;
    await tx(["runs"], "readwrite", t => t.objectStore("runs").delete(r.id));
    await loadAll(); FT.runId = null; renderFault();
  };
  // 점검 결과를 고장 이력으로: 이상 나온 단계는 원인 후보로, 전체 결과는 메모로
  $("#runCase").onclick = () => {
    const line = (s, i) => { const x = r.res[s.id] || {}; return `${i + 1}. ${s.text}${x.ok === true ? " → 정상" : x.ok === false ? " → 이상" : " → 확인 안 함"}${x.v ? ` (${x.v})` : ""}`; };
    const links = [], seen = new Set();
    for (const s of r.steps) if (s.link && !seen.has(s.link.hash + "/" + s.link.page)){ seen.add(s.link.hash + "/" + s.link.page); links.push(s.link); }
    caseEditor(null, {date: ymd(r.at), car: r.car, symptom: r.title, cause: bad.map(s => s.text + (r.res[s.id].v ? ` (${r.res[s.id].v})` : "")).join("\n"),
      memo: "점검 결과\n" + r.steps.map(line).join("\n") + (PINS.some(p => p.runId === r.id) ? "\n측정 메모\n" + PINS.filter(p => p.runId === r.id).map(pinLine).join("\n") : "") + (r.memo ? "\n" + r.memo : ""), links});
  };
  bindLinks(el);
}

/* ---------- viewer ---------- */
const V = {doc: null, fileId: null, page: 1, zoom: 1, fitScale: 1, query: "", rendering: null, pending: false};
let docCache = {id: null, doc: null};
async function openViewer(fileId, page, query){
  if (!fileById(fileId)) return;
  $("#viewer").classList.add("open");
  if (!PANE) history.pushState({viewer: 1}, "");
  V.back = []; V.zone = null;
  await showDoc(fileId, page, query);
}
/* 도면 열기 (연결 표시로 이동할 때도 씀). zoom을 주면 그 배율로 */
async function showDoc(fileId, page, query, zoom){
  const f = fileById(fileId); if (!f) return;
  $("#vTitle").textContent = f.name; $("#vTotal").textContent = "/ " + f.pages;
  V.fileId = fileId; V.page = page; V.query = query || ""; V.zoom = zoom || (V.query ? 2.5 : 1);  // 검색해서 열면 일치 위치를 확대해서 보여줌
  $("#vQ").value = V.query; V.hitIdx = 0;
  V.findPages = V.query ? search(V.query).filter(r => r.fileId === fileId).map(r => r.page).sort((a, b) => a - b) : [];
  if (docCache.id !== fileId){
    if (docCache.doc) docCache.doc.destroy();
    docCache = {id: null, doc: null};
    const pdfjs = await getPdfjs();
    const blob = await tx(["blobs"], "readonly", t => req(t.objectStore("blobs").get(fileId)));
    const doc = await pdfjs.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
    docCache = {id: fileId, doc};
  }
  V.doc = docCache.doc;
  // 연결 표시로 왔으면 그 칸이 화면에 차도록 확대
  const z = V.zone;
  if (z && z.fileId === fileId && z.page === page){
    z.scroll = true;
    const pg = await V.doc.getPage(page), g = await gridOf(fileId, page, pg), zr = g && zoneRect(g, z.col, z.row);
    V.zoom = zr ? Math.max(1.5, Math.min(4, 0.6 / zr.w)) : 1;
  }
  await renderPage();
}
function closeViewer(){ closeSplit(); $("#viewer").classList.remove("open"); render(); }
window.addEventListener("popstate", () => {
  if ($("#sheet").classList.contains("open")){ closeSheet(true); return; }
  if (!$("#viewer").classList.contains("open")) return;
  // 연결 표시로 옮겨 다녔으면 뒤로 가기는 앞 도면으로, 닫기는 한 번에 닫기
  if (V.back && V.back.length && !V.closing){ goBackRef(); return; }
  V.closing = false; closeViewer();
});
$("#vClose").onclick = () => {
  if (PANE){ parent.postMessage({ktx: "closeSplit"}, location.origin); return; } const n = (V.back || []).length; if (n){ V.closing = true; V.back = []; V.zone = null; } history.go(-(n + 1)); };
$("#vPrev").onclick = () => goPage(V.page - 1);
$("#vNext").onclick = () => goPage(V.page + 1);
$("#vPage").onchange = e => goPage(parseInt(e.target.value, 10) || V.page);
$("#vZoomIn").onclick = () => setZoom(V.zoom * 1.4);
$("#vZoomOut").onclick = () => setZoom(V.zoom / 1.4);
$("#vFit").onclick = () => setZoom(1);
$("#vOpts").onclick = () => viewOptions();
$("#vSplit").onclick = () => document.body.classList.contains("splitting") ? closeSplit() : splitPicker();
/* 보기 화면 안에서 찾기: 이 쪽에 있으면 그 위치로, 없으면 이 도면에서 처음 나오는 쪽으로 이동 */
$("#vFind").onsubmit = e => {
  e.preventDefault();
  const q = $("#vQ").value.trim(); $("#vQ").blur();
  V.query = q; V.hitIdx = 0;
  if (!q){ V.findPages = []; renderPage(); return; }
  pushRecent(q);
  const pages = search(q).filter(r => r.fileId === V.fileId).map(r => r.page).sort((a, b) => a - b);
  V.findPages = pages;
  if (!pages.length){ toast("이 도면에서 찾지 못했습니다"); renderPage(); return; }
  V.zoom = Math.max(V.zoom, 2.5);
  if (!pages.includes(V.page)) V.page = pages.find(p => p > V.page) || pages[0];
  renderPage();
};
$("#vNextHit").onclick = () => {
  const hits = document.querySelectorAll("#hl .hit");
  if (hits.length > 1 && (V.hitIdx || 0) < hits.length - 1){ V.hitIdx = (V.hitIdx || 0) + 1; scrollToHit(hits[V.hitIdx]); return; }
  const pages = V.findPages || [], next = pages.find(p => p > V.page) || pages[0];
  if (next && next !== V.page){ V.hitIdx = 0; goPage(next); }
  else if (hits.length){ V.hitIdx = 0; scrollToHit(hits[0]); }
};
function scrollToHit(el){
  const st = $("#stage");
  st.scrollTo({left: el.offsetLeft + el.offsetWidth / 2 - st.clientWidth / 2, top: el.offsetTop + el.offsetHeight / 2 - st.clientHeight / 2});
}
$("#hl").addEventListener("click", e => {
  const d = e.target.closest(".ocrbox"), pn = e.target.closest(".pin");
  if (pn) pinEditor(PINS.find(p => p.id === pn.dataset.pin));
  else if (d){ const wr = $("#pagewrap").getBoundingClientRect(), r = d.getBoundingClientRect(); wordSheet(d.dataset.t, {x: (r.left + r.width / 2 - wr.left) / wr.width, y: (r.top - wr.top) / wr.height}); }
});
function goPage(p){ if (!V.doc) return; p = Math.max(1, Math.min(V.doc.numPages, p)); if (p !== V.page){ V.page = p; renderPage(); } else $("#vPage").value = p; }
function setZoom(z){
  const st = $("#stage"), cx = (st.scrollLeft + st.clientWidth / 2) / st.scrollWidth, cy = (st.scrollTop + st.clientHeight / 2) / st.scrollHeight;
  V.zoom = Math.max(0.5, Math.min(8, z));
  renderPage().then(() => { st.scrollLeft = cx * st.scrollWidth - st.clientWidth / 2; st.scrollTop = cy * st.scrollHeight - st.clientHeight / 2; });
}

/* pinch zoom: 손가락 두 개로 확대, 손을 떼면 그 배율로 다시 그림 */
(() => {
  const st = $("#stage"), wrap = $("#pagewrap");
  let d0 = 0, z0 = 1, active = false;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  st.addEventListener("touchstart", e => { if (e.touches.length === 2){ d0 = dist(e.touches); z0 = V.zoom; active = true; } }, {passive: true});
  st.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const r = dist(e.touches) / d0;
    wrap.style.transform = `scale(${Math.max(0.5 / z0, Math.min(8 / z0, r))})`;
  }, {passive: false});
  st.addEventListener("touchend", e => {
    if (!active || e.touches.length) return;
    active = false;
    const m = new DOMMatrix(getComputedStyle(wrap).transform);
    wrap.style.transform = "";
    setZoom(z0 * (m.a || 1));
  });
})();

async function renderPage(){
  if (!V.doc) return;
  if (V.rendering){ V.pending = true; try { V.rendering.cancel(); } catch {} return; }
  const page = await V.doc.getPage(V.page);
  $("#vPage").value = V.page;
  const st = $("#stage"), base = page.getViewport({scale: 1});
  V.fitScale = (st.clientWidth - 20) / base.width;  // 도면은 가로가 길어서 폭 맞춤
  if (V.fitScale <= 0 || !isFinite(V.fitScale)) V.fitScale = 1;
  const scale = V.fitScale * V.zoom, vp = page.getViewport({scale});
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  // 너무 큰 캔버스는 모바일에서 실패하므로 픽셀 수 제한
  let pr = dpr; const maxPx = 16e6;
  if (vp.width * vp.height * pr * pr > maxPx) pr = Math.sqrt(maxPx / (vp.width * vp.height));
  const cv = $("#cv"), wrap = $("#pagewrap");
  const tmp = document.createElement("canvas");
  tmp.width = Math.floor(vp.width * pr); tmp.height = Math.floor(vp.height * pr);
  const task = page.render({canvasContext: tmp.getContext("2d"), viewport: vp, transform: pr !== 1 ? [pr, 0, 0, pr, 0, 0] : null});
  V.rendering = task;
  try { await task.promise; } catch (err){ if (err && err.name !== "RenderingCancelledException") console.error(err); }
  V.rendering = null;
  if (V.pending){ V.pending = false; return renderPage(); }
  cv.width = tmp.width; cv.height = tmp.height;
  cv.getContext("2d").drawImage(tmp, 0, 0);
  cv.style.width = vp.width + "px"; cv.style.height = vp.height + "px";
  wrap.style.width = vp.width + "px"; wrap.style.height = vp.height + "px";
  await highlight(page, vp);
  const zone = await drawRefs(page, vp);
  if (zone && V.zone.scroll){ V.zone.scroll = false; scrollToHit(zone.div); }
  drawPins(vp);
  if (optOn("tap")) await collectWords(page, vp); else V.tapWords = [];
  trailPush(); renderTrail();
  renderFoot();
}

async function highlight(page, vp){
  const hl = $("#hl"); hl.innerHTML = "";
  const toks = tokens(V.query);
  // 정확히 일치(파란 박스)는 일부 일치(노란 박스)보다 앞에 둬서 처음 이동하는 곳·"다음 위치" 순서도 정확히 일치부터
  const exact = [], part = [];
  const isExact = str => { const ws = splitWords(str); return toks.some(tk => ws.includes(tk)); };
  const place = (div, ex) => { div.className = ex ? "hit exact" : "hit"; (ex ? exact : part).push(div); };
  const pg = PAGES.find(x => x.fileId === V.fileId && x.page === V.page);
  if (pg && pg.ocr && (toks.length || V.showOcr)){
    for (const w of pg.ocr.words){
      const n = norm(w.t);
      const sk = skel(n);
      const hit = toks.length && toks.some(tk => n.includes(tk) || (n.length >= 2 && tk.includes(n)) || (/\d/.test(tk) && (sk.includes(skel(tk)) || (sk.length >= 3 && skel(tk).includes(sk)))));
      if (!hit && !V.showOcr) continue;
      const div = document.createElement("div");
      div.style.left = w.x * vp.width - 2 + "px"; div.style.top = w.y * vp.height - 2 + "px";
      div.style.width = w.w * vp.width + 4 + "px"; div.style.height = w.h * vp.height + 4 + "px";
      if (!hit){ div.className = "ocrbox"; div.title = w.t; div.dataset.t = w.t; hl.appendChild(div); continue; }
      place(div, isExact(w.t));
    }
  }
  const finish = () => {
    for (const d of exact.concat(part)) hl.appendChild(d);
    const first = exact[0] || part[0] || null;
    if (first && V.zoom > 1.01) scrollToHit(first);
    return first;
  };
  if (!toks.length) return finish();
  const tc = await page.getTextContent();
  for (const it of tc.items){
    if (!it.str) continue;
    const n = norm(it.str);
    if (!toks.some(tk => n.includes(tk) || (n.length >= 2 && tk.includes(n)))) continue;
    const [a, b, c, d, e, f] = it.transform;
    const h = Math.hypot(c, d) || Math.hypot(a, b);
    const ang = Math.atan2(b, a);
    const r = vp.convertToViewportRectangle([e, f - h * 0.2, e + it.width * Math.cos(ang) - h * Math.sin(ang) * 0, f + h * 0.95]);
    let [x1, y1, x2, y2] = r;
    if (Math.abs(ang) > 0.5){ // 세로 글자
      const r2 = vp.convertToViewportRectangle([e - h * 0.95, f, e + h * 0.2, f + it.width]); [x1, y1, x2, y2] = r2;
    }
    const div = document.createElement("div");
    div.style.left = Math.min(x1, x2) - 2 + "px"; div.style.top = Math.min(y1, y2) - 2 + "px";
    div.style.width = Math.abs(x2 - x1) + 4 + "px"; div.style.height = Math.abs(y2 - y1) + 4 + "px";
    place(div, isExact(it.str));
  }
  return finish();
}

/* ---------- 고장 추적 도구: 보기 설정, 지나온 경로, 글자 눌러 찾기, 측정 메모, 나란히 보기 ---------- */
// 화면이 복잡해질 수 있는 것은 켜고 끌 수 있게 (기기에 기억)
const VIEW_OPTS = {
  refs: ["ktx-refs", "다른 도면 연결 표시", "490.8B 같은 표시에 초록 박스, 누르면 그 도면으로"],
  trail: ["ktx-trail", "지나온 경로", "위쪽 줄에 거쳐 온 도면을 보여주고, 누르면 그 단계로"],
  pins: ["ktx-pins", "측정 메모 핀", "도면 위에 적어 둔 측정값을 핀으로 표시"],
  tap: ["ktx-tap", "글자 눌러서 찾기", "선번호·장치 이름을 누르면 같은 글자가 나오는 도면을 모아 보기"]
};
const optOn = k => { try { return localStorage.getItem(VIEW_OPTS[k][0]) !== "0"; } catch { return true; } };
const setOpt = (k, v) => { try { localStorage.setItem(VIEW_OPTS[k][0], v ? "1" : "0"); } catch {} };
function viewOptions(){
  openSheet(`<h3 style="margin-top:0">보기 설정</h3>
    ${Object.entries(VIEW_OPTS).map(([k, [, label, sub]]) => `<label class="opt"><input type="checkbox" data-opt="${k}" ${optOn(k) ? "checked" : ""}><span><b>${label}</b><br><span class="muted">${sub}</span></span></label>`).join("")}
    <div class="row" style="margin-top:12px"><span class="grow"></span><button class="btn primary" id="optDone">닫기</button></div>`);
  $("#sheetPanel").querySelectorAll("[data-opt]").forEach(c => c.onchange = () => { setOpt(c.dataset.opt, c.checked); renderPage(); });
  $("#optDone").onclick = () => history.back();
}
// 시트를 닫고 난 뒤에 할 일 (뒤로 가기 기록이 꼬이지 않게 시트가 완전히 닫힌 다음 실행)
let sheetAfter = null;
const sheetThen = fn => { sheetAfter = fn; history.back(); };

/* 다른 도면으로 건너가기: 뒤로 가기로 돌아올 수 있게 지금 위치를 쌓아 둔다 */
async function jumpTo(fileId, page, query, zone){
  const st = $("#stage");
  V.back = V.back || [];
  V.back.push({fileId: V.fileId, page: V.page, zoom: V.zoom, query: V.query, sx: st.scrollLeft / st.scrollWidth, sy: st.scrollTop / st.scrollHeight, from: fileById(V.fileId).name});
  if (!PANE) history.pushState({viewer: 1, jump: 1}, "");  // 옆 칸은 뒤로 가기 기록을 쓰지 않고 돌아가기 버튼으로만
  V.zone = zone || null;
  await showDoc(fileId, page, query || "");
}

/* 지나온 경로: 처음 간 순서대로 쌓고, 이미 지나온 곳으로 돌아가면 그 자리만 표시한다 (앞쪽 경로도 남겨 두어 다시 갈 수 있게) */
let TRAIL = (() => { try { return JSON.parse(localStorage.getItem("ktx-trail-list") || "[]"); } catch { return []; } })();
function trailPush(){
  if (PANE) return;  // 옆 칸에서 본 건 경로에 넣지 않음
  const i = TRAIL.findIndex(t => t.fileId === V.fileId && t.page === V.page);
  if (i < 0) TRAIL.push({fileId: V.fileId, page: V.page});
  TRAIL = TRAIL.filter(t => fileById(t.fileId)).slice(-15);
  try { localStorage.setItem("ktx-trail-list", JSON.stringify(TRAIL)); } catch {}
}
const shortName = f => f.name.length > 14 ? f.name.slice(0, 13) + "…" : f.name;
function renderTrail(){
  const el = $("#vTrail");
  el.hidden = PANE || !optOn("trail") || TRAIL.length < 2;
  if (el.hidden) return;
  el.innerHTML = `<span class="muted">경로</span>` + TRAIL.map((t, i) => {
    const f = fileById(t.fileId), cur = t.fileId === V.fileId && t.page === V.page;
    return `${i ? '<span class="muted">›</span>' : ""}<span class="chip x ${cur ? "cur" : ""}" data-ti="${i}">${esc(shortName(f))}${f.pages > 1 ? " " + t.page + "쪽" : ""}</span>`;
  }).join("") + `<button class="btn sm" id="trailClear">지우기</button>`;
  el.querySelectorAll("[data-ti]").forEach(c => c.onclick = () => { const t = TRAIL[+c.dataset.ti]; if (t.fileId !== V.fileId || t.page !== V.page) jumpTo(t.fileId, t.page, ""); });
  $("#trailClear").onclick = () => { TRAIL = [{fileId: V.fileId, page: V.page}]; trailPush(); renderTrail(); };
  el.scrollLeft = el.scrollWidth;
}

/* 누를 수 있는 글자: 인식한 글자와 PDF 안 글자의 화면 위치 */
async function collectWords(page, vp){
  const out = [];
  const pg = PAGES.find(x => x.fileId === V.fileId && x.page === V.page);
  if (pg && pg.ocr) for (const w of pg.ocr.words) out.push({t: w.t, x: w.x * vp.width, y: w.y * vp.height, w: w.w * vp.width, h: w.h * vp.height});
  const tc = await page.getTextContent();
  for (const it of tc.items){
    if (!it.str || !it.str.trim()) continue;
    const [a, b, c, d, e, f] = it.transform, h = Math.hypot(c, d) || Math.hypot(a, b);
    if (Math.abs(Math.atan2(b, a)) > 0.5){  // 세로 글자는 덩어리째
      const [x1, y1, x2, y2] = vp.convertToViewportRectangle([e - h * 0.95, f, e + h * 0.2, f + it.width]);
      out.push({t: it.str, x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1)});
      continue;
    }
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle([e, f - h * 0.2, e + it.width, f + h * 0.95]);
    const X = Math.min(x1, x2), Y = Math.min(y1, y2), Wd = Math.abs(x2 - x1), Hd = Math.abs(y2 - y1), L = it.str.length;
    // 한 줄에 여러 낱말이 있으면 글자 수 비율로 나눠서 낱말마다 누를 수 있게
    let off = 0;
    for (const tk of it.str.split(/(\s+)/)){ if (tk.trim()) out.push({t: tk, x: X + Wd * off / L, y: Y, w: Wd * tk.length / L, h: Hd}); off += tk.length; }
  }
  V.tapWords = out;
}
$("#stage").addEventListener("click", e => {
  if (e.target.closest(".xref, .ocrbox, .pin")) return;  // 각자 따로 처리
  const wr = $("#pagewrap").getBoundingClientRect(), x = e.clientX - wr.left, y = e.clientY - wr.top;
  if (x < 0 || y < 0 || x > wr.width || y > wr.height) return;

});

/* ---------- 도면 연결: "490.8B" = 490번 도면의 8열 B행 칸 ---------- */
// 글자 인식이 옆 글자와 붙여 읽거나("12B57NO122.4E") 앞뒤에 잡글자를 붙이는 일이 많아서, 낱말 안 어디에 있든 찾는다.
// 행 글자 B를 8로 읽는 경우도 많은데, 8 뒤에 숫자가 이어지면 다른 번호의 일부로 본다
const REF_RE = /(?<![\d.])(\d{2,4})\.(1[0-2]|[1-9])(?:([A-L])|(8)(?!\d))/;
function parseRef(s){
  const m = (s || "").toUpperCase().match(REF_RE);
  if (!m || (m[4] && m[1].length < 3)) return null;  // "04.18" 같은 날짜 조각은 빼기
  const row = m[3] || "B";
  return {sheet: +m[1], col: +m[2], row, label: `${m[1]}.${m[2]}${row}`};
}
/* 그 쪽에 있는 연결 표시와 화면 위치 */
async function pageRefs(page, vp){
  const out = [];
  const pg = PAGES.find(x => x.fileId === V.fileId && x.page === V.page);
  if (pg && pg.ocr) for (const w of pg.ocr.words){
    const r = parseRef(w.t);
    if (r) out.push({...r, x: w.x * vp.width, y: w.y * vp.height, w: w.w * vp.width, h: w.h * vp.height});
  }
  const tc = await page.getTextContent();
  for (const it of tc.items){
    const r = (it.str || "").split(/\s+/).map(parseRef).find(Boolean);
    if (!r) continue;
    const [, , , , e, f] = it.transform, h = Math.hypot(it.transform[2], it.transform[3]) || 8;
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle([e, f - h * 0.2, e + it.width, f + h * 0.95]);
    out.push({...r, x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1)});
  }
  return out;
}
/* 도면 번호로 등록된 도면 찾기: 파일 이름 앞 번호 → 이름 속 번호 → 도면 안 WBS 번호(…-T-490) */
function findSheet(num){
  const lead = f => { const m = f.name.match(/^\D{0,3}?0*(\d+)/); return m ? +m[1] : -1; };
  const wbs = p => [...pageWords(p)].some(w => w.length >= 6 && new RegExp("t0*" + num + "$").test(w));
  const pageIn = f => (PAGES.find(p => p.fileId === f.id && wbs(p)) || {page: 1}).page;
  let f = FILES.find(f => lead(f) === num) || FILES.find(f => (f.name.match(/\d+/g) || []).some(n => +n === num));
  if (f) return {fileId: f.id, page: pageIn(f)};
  const p = PAGES.find(wbs);
  return p ? {fileId: p.fileId, page: p.page} : null;
}
/* 테두리의 칸 눈금 찾기: 바깥 틀 선 바깥쪽으로 튀어나온 짧은 선이 칸 경계.
   열 번호는 오른쪽이 1, 행 글자는 아래가 A. 못 찾으면 null */
const gridCache = new Map();
async function detectGrid(page){
  // 스캔이면 원래 해상도(가는 선이 흐려지지 않게, 최대 긴 변 4500), 선 도면이면 긴 변 3000
  const base = page.getViewport({scale: 1}), long = Math.max(base.width, base.height);
  const src = await pageSource(page, base), s = src.vector ? 3000 / long : Math.min(src.scale, 4500 / long);
  const vp = page.getViewport({scale: s}), W = Math.floor(vp.width), H = Math.floor(vp.height);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", {willReadFrequently: true});
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  const px = ctx.getImageData(0, 0, W, H).data, dark = new Uint8Array(W * H);
  // 스캔은 종이 바탕색(밝은 쪽 10%)보다 확실히 어두운 것을 선으로 본다. 흐린 가는 선도 잡히게
  let cut = 3 * 150, cut2 = cut;
  if (!src.vector){
    const hist = new Uint32Array(766); for (let i = 0; i < W * H; i += 7) hist[px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]]++;
    let n = 0, total = Math.ceil(W * H / 7), paper = 765; for (let v = 765; v >= 0; v--){ n += hist[v]; if (n > total * 0.1){ paper = v; break; } }
    cut = paper - 3 * 50; cut2 = paper - 3 * 70;
  }
  // 1: 선, 3: 진한 선 (눈금이 틀에 붙어 있는지는 진한 선으로만 본다. 흐린 스캔에서 번호 글자와 틀 사이 틈이 메워지지 않게)
  for (let i = 0; i < W * H; i++){ const v = px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]; dark[i] = v < cut2 ? 3 : v < cut ? 1 : 0; }
  const D = (x, y) => x >= 0 && y >= 0 && x < W && y < H && dark[y * W + x], u = Math.max(W, H) / 3000;  // u: 긴 변 3000 기준 픽셀 배율
  const P = (horiz, a, b) => horiz ? D(a, b) : D(b, a);  // horiz: a가 가로 위치, b가 세로 위치
  const S = (horiz, a, b) => P(horiz, a, b) === 3;
  // 틀 선: 가운데 80%를 16토막으로 나눠 토막마다 가장 바깥의 긴 선을 찾고 직선으로 맞춘다 (스캔이 살짝 기울어도 되게)
  const frame = (horiz, dir) => {
    const N = horiz ? W : H, M = horiz ? H : W, sw = Math.round(N * 0.05), pts = [];
    for (let i = 0; i < 16; i++){
      const c0 = Math.round(N * 0.1 + i * sw);
      for (let j = 0; j < M * 0.2; j++){
        const b = dir < 0 ? j : M - 1 - j;
        let c = 0; for (let a = c0; a < c0 + sw; a++) c += P(horiz, a, b) || P(horiz, a, b - dir) || P(horiz, a, b - 2 * dir) ? 1 : 0;
        if (c >= sw * 0.85){
          // 세 줄을 묶어 찾았으니, 선이 실제로 시작하는 줄로 옮긴다
          const row = b => { let n = 0; for (let a = c0; a < c0 + sw; a++) n += P(horiz, a, b) ? 1 : 0; return n; };
          let e = b; while (e !== b - 2 * dir && row(e) < sw * 0.3) e -= dir;
          pts.push([c0 + sw / 2, e]); break;
        }
      }
    }
    const lsq = q => { const n = q.length, mx = q.reduce((t, p) => t + p[0], 0) / n, my = q.reduce((t, p) => t + p[1], 0) / n;
      const k = q.reduce((t, p) => t + (p[0] - mx) * (p[1] - my), 0) / (q.reduce((t, p) => t + (p[0] - mx) ** 2, 0) || 1); return a => my + k * (a - mx); };
    if (pts.length < 8) return null;
    const med = pts.map(p => p[1]).sort((x, y) => x - y)[pts.length >> 1];
    let q = pts.filter(p => Math.abs(p[1] - med) < M * 0.02); if (q.length < 8) return null;
    let f = lsq(q); q = q.filter(p => Math.abs(p[1] - f(p[0])) <= 3 * u); if (q.length < 6) return null;
    f = lsq(q); return f;
  };
  const fT = frame(true, -1), fB = frame(true, 1), fL = frame(false, -1), fR = frame(false, 1);
  if (!fT || !fB || !fL || !fR) return null;
  const top = fT(W / 2), bot = fB(W / 2), left = fL(H / 2), right = fR(H / 2);
  const len = Math.max(4, Math.round(Math.min(W, H) * 0.003));
  // 틀에 붙어서 바깥쪽으로 len 이상 이어진 가는 선. 번호 글자는 옆 획 때문에 빠진다
  const ticks = (from, to, f, dir, horiz) => {
    const hits = [];
    for (let a = Math.round(from) + len; a < to - len; a++){
      const e = Math.round(f(a));
      let ok = true;
      for (let k = 1; k <= len + 1 && ok; k++){ const b = e + dir * k; ok = S(horiz, a, b) || S(horiz, a - 1, b) || S(horiz, a + 1, b); }
      // 눈금은 홀로 선 가는 선: 옆에 다른 획이 있으면 번호 글자("12", "10")로 본다
      for (let k = 3; k <= len + 1 && ok; k++){
        const b = e + dir * k;
        for (let o = Math.round(4 * u); o <= Math.round(7 * u) && ok; o++) ok = !(P(horiz, a - o, b) || P(horiz, a + o, b));
      }
      if (ok){ if (hits.length && a - hits[hits.length - 1].e <= 3 * u) hits[hits.length - 1].e = a; else hits.push({s: a, e: a}); }
    }
    return hits.map(h => (h.s + h.e) / 2);
  };
  // 눈금은 같은 간격이라서, 번호 글자나 기호가 섞여 들어와도 같은 간격으로 늘어선 것만 고른다.
  // 표제란에 가려 빠진 눈금은 그 간격으로 채운다
  const fit = (marks, a, b) => {
    marks = [...new Set(marks.map(Math.round))].sort((p, q) => p - q);
    let best = null;
    for (let i = 0; i < marks.length; i++) for (let j = i + 1; j < marks.length; j++){
      const d = marks[j] - marks[i]; if (d < (b - a) * 0.04) continue;
      const tol = d * 0.03 + 2 * u, hit = marks.filter(m => { const k = Math.round((m - marks[i]) / d); return Math.abs(m - marks[i] - k * d) <= tol; });
      if (!best || hit.length > best.hit.length || (hit.length === best.hit.length && d > best.d)) best = {d, hit};
    }
    if (!best || best.hit.length < 2) return null;
    const {d, hit} = best, edges = [a];
    let m = hit[0]; while (m - d > a + d * 0.5) m -= d;
    for (; m < b - d * 0.5; m += d){ const near = hit.find(h => Math.abs(h - m) <= d * 0.1); edges.push(near || m); if (near) m = near; }
    edges.push(b);
    return edges;
  };
  // 양쪽 테두리에 다 있는 눈금을 먼저 믿는다 (번호 글자는 한쪽에서만 눈금처럼 보이는 경우가 많다)
  // 스캔이 기울었으면 맞은편 눈금은 그만큼 밀려 있다 (sh)
  const both = (p, q, sh, a, b) => { q = q.map(n => n - sh); const c = p.filter(m => q.some(n => Math.abs(m - n) <= 3 * u)); return (c.length >= 2 && fit(c, a, b)) || fit([...p, ...q], a, b); };
  const xs = both(ticks(left, right, fT, -1, true), ticks(left, right, fB, 1, true), fL(bot) - fL(top), left, right);
  const ys = both(ticks(top, bot, fL, -1, false), ticks(top, bot, fR, 1, false), fT(right) - fT(left), top, bot);
  const pitch = e => e && (e[e.length - 2] - e[1]) / Math.max(1, e.length - 3) || (e && e.length === 3 ? (e[2] - e[0]) / 2 : 0);
  const split = (a, b, d) => { const n = Math.max(1, Math.round((b - a) / d)); return Array.from({length: n + 1}, (_, i) => a + (b - a) * i / n); };
  let gx = xs, gy = ys;
  // 번호 글자가 눈금으로 잡히면 칸 가운데마다 표시가 생겨 간격이 절반으로 나온다. 가로·세로 간격을 비교해 바로잡는다
  const halve = e => {
    const inner = e.slice(1, -1), d = pitch(e) * 2, a = e[0], b = e[e.length - 1];
    const cand = [inner.filter((_, i) => i % 2 === 0), inner.filter((_, i) => i % 2 === 1)];
    const off = c => { const f = (c[0] - a) / d; return Math.abs(f - Math.round(f)); };  // 틀에서 첫 눈금까지가 칸 하나 너비에 가까운 쪽
    return [a, ...cand.sort((p, q) => off(p) - off(q))[0], b];
  };
  if (gx && gy){
    let r = pitch(gx) / pitch(gy);
    if (r > 0.4 && r < 0.62) gx = halve(gx); else if (r > 1.6 && r < 2.5) gy = halve(gy);
    r = pitch(gx) / pitch(gy);
    if (!(r > 0.7 && r < 1.4)) return null;
  }
  // 한쪽 눈금만 찾았으면, 칸이 거의 정사각형인 것을 이용해 다른 쪽을 같은 간격으로 나눈다
  else if (gx) gy = split(top, bot, pitch(gx));
  else if (gy) gx = split(left, right, pitch(gy));
  else return null;
  return {xs: gx.map(v => v / W), ys: gy.map(v => v / H)};
}
async function gridOf(fileId, pageNo, page){
  const k = fileId + "/" + pageNo;
  if (!gridCache.has(k)) gridCache.set(k, await detectGrid(page).catch(err => { console.warn(err); return null; }));
  return gridCache.get(k);
}
/* 칸의 위치 (쪽 크기에 대한 비율). 열 1은 오른쪽 끝, 행 A는 아래 끝 */
function zoneRect(g, col, row){
  const nc = g.xs.length - 1, nr = g.ys.length - 1, ci = nc - col, ri = nr - 1 - (row.charCodeAt(0) - 65);
  if (ci < 0 || ci >= nc || ri < 0 || ri >= nr) return null;
  return {x: g.xs[ci], y: g.ys[ri], w: g.xs[ci + 1] - g.xs[ci], h: g.ys[ri + 1] - g.ys[ri]};
}
async function goRef(r){
  const t = findSheet(r.sheet);
  if (!t){ toast(`${r.sheet}번 도면이 등록돼 있지 않아요`, 3000); return; }
  await jumpTo(t.fileId, t.page, "", {fileId: t.fileId, page: t.page, col: r.col, row: r.row, label: r.label});
}
async function goBackRef(){
  const b = V.back.pop(); V.zone = null;
  await showDoc(b.fileId, b.page, b.query || "", b.zoom);
  const st = $("#stage"); st.scrollLeft = b.sx * st.scrollWidth; st.scrollTop = b.sy * st.scrollHeight;
}
/* 연결 표시 상자와, 이동해 온 칸 표시 */
async function drawRefs(page, vp){
  const hl = $("#hl");
  V.refs = optOn("refs") ? await pageRefs(page, vp) : [];
  for (const r of V.refs){
    const div = document.createElement("div");
    div.className = "xref"; div.dataset.ref = r.label;
    div.style.left = r.x - 3 + "px"; div.style.top = r.y - 3 + "px"; div.style.width = r.w + 6 + "px"; div.style.height = r.h + 6 + "px";
    hl.appendChild(div);
  }
  const z = V.zone;
  if (!z || z.fileId !== V.fileId || z.page !== V.page) return null;
  const g = await gridOf(V.fileId, V.page, page), zr = g && zoneRect(g, z.col, z.row);
  z.found = !!zr;
  if (!zr) return null;
  const div = document.createElement("div");
  div.className = "zone"; div.dataset.label = z.label;
  div.style.left = zr.x * vp.width + "px"; div.style.top = zr.y * vp.height + "px";
  div.style.width = zr.w * vp.width + "px"; div.style.height = zr.h * vp.height + "px";
  hl.appendChild(div);
  return {div, zr};
}
$("#hl").addEventListener("click", e => { const d = e.target.closest(".xref"); if (d) goRef(parseRef(d.dataset.ref)); });

function refFoot(){
  const z = V.zone, here = z && z.fileId === V.fileId && z.page === V.page, b = (V.back || [])[V.back ? V.back.length - 1 : 0];
  const labels = [...new Set((V.refs || []).map(r => r.label))].sort((a, c) => parseFloat(a) - parseFloat(c) || a.localeCompare(c));
  let html = "";
  if (b) html += `<div class="row" style="margin-top:6px"><button class="btn sm" id="refBack">← ${esc(b.from)} ${b.page}쪽으로 돌아가기</button>
    ${here ? `<span class="muted">${esc(z.label)} ${z.found ? "칸을 보라색 점선으로 표시했어요" : "칸 위치를 못 찾아서 도면만 열었어요"}</span>` : ""}</div>`;
  if (labels.length) html += `<div class="chips"><span class="muted">다른 도면으로 연결</span> ${labels.map(l => `<span class="chip x ref${findSheet(parseRef(l).sheet) ? "" : " none"}" data-ref="${l}">${l}</span>`).join("")}</div>`;
  return html;
}
const pageCases = () => CASES.filter(c => (c.links || []).some(l => linkFile(l)?.id === V.fileId && l.page === V.page)).sort(byDate);
function renderFoot(){
  $("#vSplit").hidden = !canSplit() && !document.body.classList.contains("splitting");
  const tg = tagsOf(V.fileId, V.page);
  const hits = document.querySelectorAll("#hl .hit").length, exactHits = document.querySelectorAll("#hl .hit.exact").length;
  const pg = PAGES.find(x => x.fileId === V.fileId && x.page === V.page);
  $("#vFoot").innerHTML = `<div class="row">
      <div class="grow chips" style="margin:0">${tg.length ? tg.map(t => `<span class="chip x" data-t="${t.id}" title="${esc(t.note || "")}">🏷 ${esc(t.label)}</span>`).join("") : '<span class="muted">이 페이지에 태그 없음</span>'}</div>
      <button class="btn sm ${V.pinMode ? "primary" : ""}" id="pinBtn">${V.pinMode ? "📍 누를 곳 고르는 중 (취소)" : "📍 측정 메모"}</button><button class="btn sm" id="addCase">＋ 고장 기록</button><button class="btn sm primary" id="addTag">＋ 태그</button></div>
    ${pageCases().length ? `<div class="chips"><span class="muted">이 쪽과 연결된 고장 기록</span> ${pageCases().map(c => `<span class="chip x" data-vc="${c.id}">🛠 ${esc(c.symptom)} ${esc(c.date || "")}</span>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:6px">
      <button class="btn sm" id="ocrPage">${pg && pg.ocr ? "이 쪽 다시 인식" : "이 쪽 글자 인식"}</button>
      ${pg && pg.ocr ? `<label class="muted row" style="gap:4px"><input type="checkbox" id="showOcr" ${V.showOcr ? "checked" : ""}> 인식된 글자 ${pg.ocr.words.length}개 표시</label>` : ""}
      ${pg && pg.ocr && V.showOcr ? '<span class="muted">회색 점선 박스를 누르면 같은 글자가 나오는 곳을 찾아요</span>' : ""}
      ${pinsHere().length ? `<span class="muted">측정 메모 ${pinsHere().length}개${optOn("pins") ? "" : " (보기 설정에서 꺼 둠)"}</span>` : ""}
    </div>
    ${refFoot()}
    ${V.query ? `<div class="muted" style="margin-top:6px">“${esc(V.query)}” 이 쪽에 ${hits}곳${hits ? ` (<span class="lg-ex">■</span> 정확히 일치 ${exactHits} · <span class="lg-pt">■</span> 일부 일치 ${hits - exactHits})` : ""}${hits && V.zoom <= 1.01 ? " · 확대하면 해당 위치로 이동" : ""}</div>
      ${(V.findPages || []).length > 1 ? `<div class="chips"><span class="muted">이 도면에서 나오는 쪽</span> ${V.findPages.map(p => `<span class="chip x" data-gp="${p}">${p === V.page ? "▶ " : ""}${p}쪽</span>`).join("")}</div>` : ""}` : ""}`;
  $("#vNextHit").hidden = !V.query || (hits <= 1 && (V.findPages || []).length <= 1);
  $("#vFoot").querySelectorAll("[data-gp]").forEach(c => c.onclick = () => { V.hitIdx = 0; goPage(+c.dataset.gp); });
  $("#addTag").onclick = () => tagEditor(null);
  $("#addCase").onclick = () => caseEditor(null, {links: [mkLink(V.fileId, V.page)]});
  $("#vFoot").querySelectorAll("[data-vc]").forEach(c => c.onclick = () => caseEditor(CASES.find(x => x.id === c.dataset.vc)));
  $("#vFoot").querySelectorAll("[data-ref]").forEach(c => c.onclick = () => goRef(parseRef(c.dataset.ref)));
  if ($("#refBack")) $("#refBack").onclick = () => PANE ? goBackRef() : history.back();
  $("#pinBtn").onclick = () => { V.pinMode = !V.pinMode; renderFoot(); if (V.pinMode) toast("도면에서 메모할 곳을 누르세요", 2500); };
  $("#ocrPage").onclick = () => ocrDialog(V.fileId, String(V.page));
  if ($("#showOcr")) $("#showOcr").onchange = e => { V.showOcr = e.target.checked; renderPage(); };
  $("#vFoot").querySelectorAll("[data-t]").forEach(c => c.onclick = () => tagEditor(TAGS.find(t => t.id === c.dataset.t)));
}

const SUGGEST = ["고장증상: ", "장치: ", "회로: ", "계전기: ", "차단기: ", "커넥터: "];
function tagEditor(tag){
  const labels = [...new Set(TAGS.map(t => t.label))].sort((a, b) => a.localeCompare(b, "ko"));
  openSheet(`<h3 style="margin-top:0">${tag ? "태그 수정" : "이 페이지에 태그 붙이기"}</h3>
    <div class="muted">${esc(fileById(V.fileId).name)} · ${V.page}쪽</div>
    <label class="f">태그 (고장 증상, 장치명, 회로번호 등)</label>
    <input class="t" id="tLabel" list="tagList" value="${esc(tag ? tag.label : "")}" placeholder="예: 팬토그래프 상승불가">
    <datalist id="tagList">${labels.map(l => `<option value="${esc(l)}">`).join("")}</datalist>
    <div class="chips">${SUGGEST.map(s => `<span class="chip x" data-s="${esc(s)}">${esc(s.replace(": ", ""))}</span>`).join("")}</div>
    <label class="f">메모 (점검 순서, 측정값 등 · 검색에 포함)</label>
    <textarea class="t" id="tNote" rows="3" placeholder="예: K12 접점 → 단자대 X3-14 전압 확인">${esc(tag ? tag.note || "" : "")}</textarea>
    <div class="row" style="margin-top:16px">${tag ? '<button class="btn danger" id="tDel">삭제</button>' : ""}<span class="grow"></span>
      <button class="btn" id="tCancel">취소</button><button class="btn primary" id="tSave">저장</button></div>`);
  $("#sheetPanel").querySelectorAll("[data-s]").forEach(c => c.onclick = () => { const i = $("#tLabel"); if (!i.value.startsWith(c.dataset.s)) i.value = c.dataset.s + i.value; i.focus(); });
  $("#tCancel").onclick = () => history.back();
  $("#tSave").onclick = async () => {
    const label = $("#tLabel").value.trim(); if (!label){ $("#tLabel").focus(); return; }
    const rec = {id: tag ? tag.id : uid(), fileId: V.fileId, page: V.page, label, note: $("#tNote").value.trim()};
    await tx(["tags"], "readwrite", t => t.objectStore("tags").put(rec));
    await loadAll(); history.back(); renderFoot(); toast("태그를 저장했습니다");
  };
  if (tag) $("#tDel").onclick = async () => {
    await tx(["tags"], "readwrite", t => t.objectStore("tags").delete(tag.id));
    await loadAll(); history.back(); renderFoot();
  };
  setTimeout(() => $("#tLabel").focus(), 50);
}

// redraw: 이미 열린 시트 내용만 바꿈 (뒤로 가기 기록을 또 쌓지 않고, 보던 위치도 유지)
function openSheet(html, redraw){
  const pn = $("#sheetPanel"), top = pn.scrollTop;
  pn.innerHTML = html; $("#sheet").classList.add("open");
  if (redraw) pn.scrollTop = top; else history.pushState({sheet: 1}, "");
}
function closeSheet(fromPop){
  if (!$("#sheet").classList.contains("open")) return;
  $("#sheet").classList.remove("open");
  if (!fromPop) history.back();
  const f = sheetAfter; sheetAfter = null;
  if (f) setTimeout(f, 0);
}
$("#ocrDark").onclick = () => blackout(true);
$("#sheet").onclick = e => { if (e.target.id === "sheet") history.back(); };
let rTimer; window.addEventListener("resize", () => { clearTimeout(rTimer); rTimer = setTimeout(() => { if ($("#viewer").classList.contains("open")) renderPage(); }, 250); });

/*OCR_MODULE*/

/* ---------- boot ---------- */
(async () => {
  try {
    db = await openDB();
    await loadAll();
  } catch (err){
    $("#tab-search").innerHTML = `<div class="empty">저장공간을 열 수 없습니다.<br><span class="muted">${esc(err.message)}<br>시크릿 모드에서는 사용할 수 없어요.</span></div>`;
    return;
  }
  if (PANE){
    // 나란히 보기의 오른쪽 칸: 머리글 없이 도면만
    document.body.classList.add("pane");
    const q = new URLSearchParams(location.search);
    if (fileById(q.get("f"))) openViewer(q.get("f"), +q.get("p") || 1, q.get("q") || "");
    return;
  }
  render();
  if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:" && document.querySelector('link[rel="manifest"]')){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
