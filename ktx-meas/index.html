<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>측정값 판정</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --sub:#5b6676; --line:#dde2ea;
  --accent:#1f5fae; --accent-ink:#ffffff; --chip:#e8eef7; --chip-ink:#1f4f8f;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --cau:#9a5b00; --cau-bg:#fff1d6; --bad:#c0362c; --bad-bg:#fde6e3;
  --warn:#a15c00; --warn-bg:#fff4e0; --danger:#c0362c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --card:#1c222b; --ink:#e7ebf0; --sub:#9aa5b4; --line:#2c3440;
    --accent:#5b9bf0; --accent-ink:#0d1520; --chip:#24324a; --chip-ink:#a9c8f5;
    --ok:#5fd38a; --ok-bg:#163223; --cau:#f3bb55; --cau-bg:#3a2c10; --bad:#ff7b70; --bad-bg:#3d1916;
    --warn:#f0b35a; --warn-bg:#33270f; --danger:#ff7b70;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --card:#1c222b; --ink:#e7ebf0; --sub:#9aa5b4; --line:#2c3440;
  --accent:#5b9bf0; --accent-ink:#0d1520; --chip:#24324a; --chip-ink:#a9c8f5;
  --ok:#5fd38a; --ok-bg:#163223; --cau:#f3bb55; --cau-bg:#3a2c10; --bad:#ff7b70; --bad-bg:#3d1916;
  --warn:#f0b35a; --warn-bg:#33270f; --danger:#ff7b70;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.tabs{display:flex;max-width:900px;margin:8px auto 0}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;border-bottom:3px solid transparent;color:var(--sub);font-weight:600;position:relative}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;margin-left:4px;vertical-align:1px}
main{max-width:900px;margin:0 auto;padding:12px 16px 90px}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.on{background:var(--chip);color:var(--chip-ink);border-color:var(--chip-ink)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pf .btn{padding:18px 10px;font-size:20px}
.pf .btn.pass.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.pf .btn.fail.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.crit{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.click{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;border:0;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--sub);font-size:14px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px;line-height:1.5}
.empty{text-align:center;color:var(--sub);padding:36px 10px;line-height:1.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.ck .crit{font-size:14px;padding:8px 10px}
.ckrow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ckp{font-weight:600}
.btn.pf2{padding:9px 12px}
.btn.pf2.pass.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.btn.pf2.fail.on{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.ckmemo{margin-top:6px}
.ckfoot{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.tw{overflow-x:auto;margin-top:6px}
table.tq td,table.tq th{white-space:nowrap}
#modal2{z-index:25}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
input.t,textarea.t,select.t{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:17px}
textarea.t{font-size:15px;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:720px){ .wide2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start} }
h2{font-size:17px;margin:16px 0 8px}
h3{font-size:15px;margin:12px 0 6px}
.it-name{font-weight:700}
.std{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.5}
.verdict{border-radius:14px;padding:16px;text-align:center;margin-top:12px;border:2px solid transparent}
.verdict .big{font-size:34px;font-weight:800;letter-spacing:2px}
.verdict .val{font-size:18px;font-weight:700;margin-top:4px}
.verdict .why{font-size:14px;margin-top:6px;line-height:1.5}
.v-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.v-cau{background:var(--cau-bg);color:var(--cau);border-color:var(--cau)}
.v-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.v-none{background:var(--chip);color:var(--sub)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.cau{background:var(--cau-bg);color:var(--cau)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.rev{background:var(--warn-bg);color:var(--warn)}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0}
.howto ol{margin:6px 0 0;padding-left:22px;line-height:1.6}
.howto .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.howto figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in}
.howto figure img{width:100%;height:120px;object-fit:contain;display:block;background:#fff}
.howto figcaption{font-size:12px;color:var(--sub);padding:4px 6px;line-height:1.4}
.imged{display:flex;gap:8px;align-items:center;margin-top:8px}
.imged img{width:72px;height:56px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none}
.viewer img{width:100%;height:auto;background:#fff;border-radius:8px}
.quote{border-left:3px solid var(--line);padding:4px 10px;color:var(--sub);font-size:14px;white-space:pre-wrap;margin-top:6px}
table.rec{width:100%;border-collapse:collapse;font-size:14px}
table.rec td,table.rec th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.rec th{color:var(--sub);font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
@media (min-width:720px){ .modal{align-items:center} .modal>.sheet{border-radius:16px} }
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet-head h2{margin:0;flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222c;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:15px;max-width:90vw;text-align:center}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--sub);background:var(--bg);border-radius:6px;padding:6px 8px;margin-top:6px;white-space:pre-wrap}
svg.trend{width:100%;height:auto;display:block}
.hint{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
</style>
</head>
<body>
<header>
  <div class="top"><h1>⚡ 측정값 판정</h1><span class="muted" id="offline"></span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="measure" class="on">측정</button>
    <button data-tab="check">점검표</button>
    <button data-tab="records">기록</button>
    <button data-tab="calc">계산기</button>
    <button data-tab="items">기준값</button>
  </nav>
</header>
<main id="main"></main>
<input type="file" id="filein" accept=".json,application/json" hidden>

<script>
"use strict";
/* ===== 기본 도구 ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const num = s => {
  if (s === null || s === undefined) return NaN;
  const t = String(s).trim().replace(/,/g, ".").replace(/\s/g, "");
  if (t === "") return NaN;
  if (/^(ol|∞|inf|무한대?)$/i.test(t)) return Infinity;
  return Number(t);
};
const has = v => v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v));
function fmt(v, d){
  if (v === Infinity) return "∞ (OL)";
  if (v === -Infinity) return "-∞";
  if (!Number.isFinite(v)) return "-";
  if (d !== undefined) return v.toFixed(d);
  const a = Math.abs(v);
  if (a === 0) return "0";
  if (a >= 1000) return (Math.round(v * 10) / 10).toLocaleString("ko-KR");
  return String(Number(v.toPrecision(4)));
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ===== 기기 안 저장소 (IndexedDB) — 밖으로 보내는 기능 없음 ===== */
const DB = { db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open("ktx-meas", 1);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains("items")) d.createObjectStore("items", {keyPath: "id"});
      if (!d.objectStoreNames.contains("records")) d.createObjectStore("records", {keyPath: "id"}).createIndex("itemId", "itemId");
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", {keyPath: "k"});
    };
    r.onsuccess = () => { DB.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = DB.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
  all(store){ return new Promise((res, rej) => { const r = DB.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(store, v){ return DB.tx(store, "readwrite", s => { s.put(v); }); },
  putMany(store, arr){ return DB.tx(store, "readwrite", s => { arr.forEach(v => s.put(v)); }); },
  del(store, id){ return DB.tx(store, "readwrite", s => { s.delete(id); }); },
  delMany(store, ids){ return DB.tx(store, "readwrite", s => { ids.forEach(id => s.delete(id)); }); },
  clear(store){ return DB.tx(store, "readwrite", s => { s.clear(); }); },
};

/* ===== 측정 방법(판정 공식) ===== */
const METHODS = {
  direct:    {name: "측정값 그대로 판정", short: "그대로", hint: "읽은 값을 기준 범위와 바로 비교합니다."},
  ir_temp:   {name: "절연저항 + 온도 보정", short: "온도 보정", hint: "측정할 때 온도를 넣으면 기준 온도 값으로 바꿔서 판정합니다. 기본은 온도가 10℃ 오를 때마다 절연저항이 절반이 되는 규칙입니다."},
  deviation: {name: "기준값과 차이(%) 판정", short: "기준 대비 %", hint: "코일 저항처럼 '기준값 ±10%' 식으로 정해진 항목. 기준 범위는 % 로 넣습니다."},
  vdrop:     {name: "전압강하(%) 판정", short: "전압강하", hint: "공급 쪽 전압과 부하 쪽 전압을 넣으면 강하율(%)로 판정합니다. 기준 범위는 % 로 넣습니다."},
  imbalance: {name: "상간 불평형(%) 판정", short: "불평형", hint: "U·V·W 처럼 여러 값을 넣으면 (최대−최소)÷평균 으로 불평형률을 구해 판정합니다. 기준 범위는 % 로 넣습니다."},
  formula:   {name: "여러 값으로 계산 (공식)", short: "공식", hint: "여러 측정값을 넣으면 정해 둔 공식으로 계산해서 판정합니다. 예) 입력값 KO,KC / 공식 KO-KC"},
  check:     {name: "합격/불합격 (숫자 없음)", short: "합격/불합격", hint: "숫자 없이 판정 기준을 보고 합격·불합격을 고릅니다. 눈으로 확인, 동작 확인, 내전압 시험처럼 결과가 되고/안 되고인 항목에 씁니다."},
  contact:   {name: "단선·접촉불량 (저항)", short: "단선/접촉", hint: "선이나 접점 저항을 재서 정상 저항과 비교합니다. OL(무한대)이면 단선, 정상보다 많이 높으면 접촉불량 의심입니다."},
};
const resultUnit = it => (["deviation", "vdrop", "imbalance"].includes(it.method) ? "%" : it.method === "check" ? "" : (it.unit || ""));
const isCheck = it => it && it.method === "check";
const critText = it => String((it.params && it.params.criteria) || "").trim();
const recVal = r => r.kind === "check" ? "" : `${fmt(r.value)} ${r.unit || ""}`;

function bandText(b, u){
  if (!b) return "";
  const mn = has(b.min), mx = has(b.max); u = u ? " " + u : "";
  if (mn && mx) return `${fmt(+b.min)} ~ ${fmt(+b.max)}${u}`;
  if (mn) return `${fmt(+b.min)}${u} 이상`;
  if (mx) return `${fmt(+b.max)}${u} 이하`;
  return "";
}
const inBand = (v, b) => b && (has(b.min) || has(b.max)) && (!has(b.min) || v >= +b.min) && (!has(b.max) || v <= +b.max);
function stdText(it){
  if (isCheck(it)){ const c = critText(it).replace(/\s+/g, " "); return c ? "합격 기준: " + (c.length > 70 ? c.slice(0, 70) + "…" : c) : "합격/불합격"; }
  const u = resultUnit(it); const n = bandText(it.normal, u); const c = bandText(it.caution, u);
  let s = n ? `정상 ${n}` : "기준값 없음";
  if (c) s += ` · 주의 ${c}`;
  return s;
}

/* 입력값 → 계산값, 판정 */
function evaluate(it, inp){
  const p = it.params || {}; const u = resultUnit(it); let v, detail = "", extra = {};
  if (isCheck(it)){
    if (inp.pf !== "pass" && inp.pf !== "fail") return null;
    const ok = inp.pf === "pass";
    return {value: ok ? 1 : 0, unit: "", verdict: ok ? "ok" : "bad", label: ok ? "합격" : "불합격", detail: "", inputs: inp, kind: "check"};
  }
  switch (it.method){
    case "ir_temp": {
      const r = num(inp.r), t = num(inp.temp);
      if (!Number.isFinite(r) && r !== Infinity) return null;
      const ref = has(p.refTemp) ? +p.refTemp : 20, step = has(p.halveEvery) ? +p.halveEvery : 10;
      if (Number.isFinite(t) && r !== Infinity){ v = r * Math.pow(2, (t - ref) / step); detail = `${fmt(r)} ${it.unit||""} (${fmt(t)}℃에서) → ${ref}℃ 환산 ${fmt(v)} ${it.unit||""}`; }
      else { v = r; detail = r === Infinity ? "무한대(OL) — 보정 없이 판정" : "온도를 안 넣어서 보정 없이 판정"; }
      break; }
    case "deviation": {
      let x = num(inp.x); const ref = num(p.ref);
      if (!Number.isFinite(x) || !Number.isFinite(ref) || ref === 0) return null;
      let pre = ""; const t = num(inp.temp);
      if (has(p.cuRef) && Number.isFinite(t)){ const x0 = x; x = x * (234.5 + +p.cuRef) / (234.5 + t); pre = `${fmt(x0)} ${it.unit||""} (${fmt(t)}℃) → ${p.cuRef}℃ 환산 ${fmt(x)} ${it.unit||""} · `; }
      v = (x - ref) / ref * 100; detail = `${pre}측정 ${fmt(x)} ${it.unit||""} / 기준 ${fmt(ref)} ${it.unit||""} → 차이 ${v >= 0 ? "+" : ""}${fmt(v, 1)}%`;
      break; }
    case "vdrop": {
      const vs = num(inp.vs), ve = num(inp.ve);
      if (!Number.isFinite(vs) || !Number.isFinite(ve)) return null;
      const base = has(p.nominal) ? +p.nominal : vs; if (!base) return null;
      v = (vs - ve) / base * 100; extra.dropV = vs - ve;
      detail = `강하 ${fmt(vs - ve)} V ÷ ${has(p.nominal) ? "정격 " : "공급 "}${fmt(base)} V = ${fmt(v, 2)}%`;
      break; }
    case "imbalance": {
      const labels = phaseLabels(it); const xs = labels.map((_, i) => num((inp.ph || [])[i]));
      if (xs.some(x => !Number.isFinite(x))) return null;
      const avg = xs.reduce((a, b) => a + b, 0) / xs.length; if (!avg) return null;
      v = (Math.max(...xs) - Math.min(...xs)) / avg * 100;
      detail = `최대 ${fmt(Math.max(...xs))} · 최소 ${fmt(Math.min(...xs))} · 평균 ${fmt(avg)} ${it.unit||""} → 불평형 ${fmt(v, 2)}%`;
      break; }
    case "formula": {
      const names = fNames(it); const vals = {};
      for (const n of names){ const x = num((inp.f || {})[n]); if (!Number.isFinite(x)) return null; vals[n] = x; }
      v = fEval(p.expr, vals); if (!Number.isFinite(v)) return null;
      detail = `${p.expr} = ${fmt(v)} ${it.unit || ""} (${names.map(n => n + " " + fmt(vals[n])).join(", ")})`;
      break; }
    case "contact": {
      const r = num(inp.r), lead = has(inp.lead) ? num(inp.lead) : 0;
      if (r === Infinity) return {value: Infinity, unit: u, verdict: "bad", label: "단선", detail: "OL(무한대) — 단선입니다", inputs: inp};
      if (!Number.isFinite(r)) return null;
      v = r - (Number.isFinite(lead) ? lead : 0);
      detail = lead ? `측정 ${fmt(r)} − 리드선 ${fmt(lead)} = ${fmt(v)} ${it.unit||"Ω"}` : "";
      break; }

  const hasN = it.normal && (has(it.normal.min) || has(it.normal.max));
  if (hasN){
    if (inBand(v, it.normal)){ verdict = "ok"; label = "정상"; }
    else if (inBand(v, it.caution)){ verdict = "cau"; label = "주의"; }
    else { verdict = "bad"; label = "이상"; }
    if (it.method === "contact" && verdict !== "ok"){
      const hi = has(it.normal.max) && v > +it.normal.max, lo = has(it.normal.min) && v < +it.normal.min;
      if (hi) label = verdict === "cau" ? "주의 (접촉 확인)" : "접촉불량 의심";

const fNames = it => String((it.params && it.params.inputs) || "").split(/[,\s]+/).filter(n => /^[A-Za-z가-힣_][A-Za-z0-9가-힣_]*$/.test(n));
// 공식 계산: 숫자, 입력값 이름, + - * / ( ) 만 허용하는 작은 계산기 (eval 안 씀)
function fEval(expr, vals){
  const toks = String(expr || "").match(/\d+(?:\.\d+)?|[A-Za-z가-힣_][A-Za-z0-9가-힣_]*|[-+*/()×÷−]/g) || []; let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  const prim = () => { const t = next(); if (t === "(") { const v = add(); next(); return v; } if (t === "-" || t === "−") return -prim(); if (/^\d/.test(t)) return +t; if (t in vals) return vals[t]; return NaN; };
  const mul = () => { let v = prim(); while (["*", "/", "×", "÷"].includes(peek())) { const o = next(), r = prim(); v = (o === "*" || o === "×") ? v * r : v / r; } return v; };
  const add = () => { let v = mul(); while (["+", "-", "−"].includes(peek())) { const o = next(), r = mul(); v = o === "+" ? v + r : v - r; } return v; };
  const v = add(); return i === toks.length ? v : NaN;
}

  if (isCheck(it)) return "";

  if (r.label === "단선") return "선이 끊겼거나 접점이 완전히 떨어져 있습니다.";
  const u = resultUnit(it);
  if (r.verdict === "ok") return `정상 범위(${bandText(it.normal, u)}) 안입니다.`;
  if (r.verdict === "cau") return `정상 범위(${bandText(it.normal, u)})는 벗어났지만 주의 범위(${bandText(it.caution, u)}) 안입니다.`;
  return `정상 범위(${bandText(it.normal, u)})${has(it.caution?.min) || has(it.caution?.max) ? "와 주의 범위(" + bandText(it.caution, u) + ")" : ""}를 벗어났습니다.`;
}

const vColor = v => getComputedStyle(document.documentElement).getPropertyValue({ok: "--ok", cau: "--cau", bad: "--bad"}[v] || "--sub").trim();
function spark(a){
  const vs = a.map(r => r.value).filter(Number.isFinite); if (vs.length < 2) return "";
  const W = 300, H = 36, mn = Math.min(...vs), mx = Math.max(...vs), sp = mx - mn || 1;
  const pts = a.map((r, i) => Number.isFinite(r.value) ? [i / (a.length - 1) * (W - 8) + 4, H - 4 - (r.value - mn) / sp * (H - 8), r.verdict] : null).filter(Boolean);
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" style="max-width:300px;margin-top:6px" aria-hidden="true"><polyline fill="none" stroke="var(--sub)" stroke-width="1.5" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${vColor(p[2])}"/>`).join("")}</svg>`;
}
function trendChart(a, it){
  if (isCheck(it) || a.every(r => r.kind === "check")) return `<div class="chips">${a.map(r => `<span class="tag ${r.verdict}">${esc(r.date.slice(2).replace(/-/g, "."))} ${esc(r.label)}</span>`).join("")}</div>`;
  const W = 480, H = 240, L = 50, R = 10, T = 12, B = 30;
  const vals = a.map(r => r.value).filter(Number.isFinite);
  const bands = []; const nb = it ? it.normal : null, cb = it ? it.caution : null;
  [nb, cb].forEach(b => { if (b){ if (has(b.min)) bands.push(+b.min); if (has(b.max)) bands.push(+b.max); } });
  const all = vals.concat(bands); if (!all.length) return "";
  let mn = Math.min(...all), mx = Math.max(...all); if (mn === mx){ mn -= 1; mx += 1; } const pad = (mx - mn) * 0.1; mn -= pad; mx += pad;
  const hasOL = a.some(r => r.value === Infinity);
  const top = hasOL ? T + 16 : T;
  const y = v => v === Infinity ? T + 4 : top + (1 - (v - mn) / (mx - mn)) * (H - top - B);
  const x = i => a.length === 1 ? (L + W - R) / 2 : L + i / (a.length - 1) * (W - L - R);
  let s = `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="측정값 추이">`;
  const band = (b, fill) => { if (!b || !(has(b.min) || has(b.max))) return ""; const y1 = y(has(b.max) ? Math.min(+b.max, mx) : mx), y2 = y(has(b.min) ? Math.max(+b.min, mn) : mn); return `<rect x="${L}" y="${y1}" width="${W - L - R}" height="${Math.max(0, y2 - y1)}" fill="${fill}"/>`; };
  s += band(cb, "var(--cau-bg)") + band(nb, "var(--ok-bg)");
  const raw = (mx - mn) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), stp = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw);
  for (let v = Math.ceil(mn / stp) * stp; v <= mx + 1e-9; v += stp){ s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 5}" text-anchor="end" font-size="13" fill="var(--sub)">${fmt(Math.round(v / stp) * stp)}</text>`; }
  bands.forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sub)" stroke-dasharray="4 3" stroke-width="1"/>`; });
  const pts = a.map((r, i) => [x(i), y(r.value), r]).filter(p => Number.isFinite(p[1]));
  s += `<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`;
  pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${vColor(p[2].verdict)}" stroke="var(--card)" stroke-width="1.5"/>`; });
  const step = Math.max(1, Math.ceil(a.length / 4));
  a.forEach((r, i) => { if (i % step === 0 || i === a.length - 1) s += `<text x="${x(i)}" y="${H - 10}" text-anchor="${a.length > 1 && i === a.length - 1 ? "end" : i === 0 && a.length > 1 ? "start" : "middle"}" font-size="13" fill="var(--sub)">${esc(r.date.slice(2).replace(/-/g, "."))}</text>`; });
  if (hasOL) s += `<text x="${L - 6}" y="${T + 8}" text-anchor="end" font-size="13" fill="var(--sub)">OL</text>`;
  return s + `</svg><div class="hint">초록 띠 = 정상 범위, 노란 띠 = 주의 범위 (지금 기준값으로 그림)</div>`;
}

const clean = o => { Object.keys(o).forEach(k => (o[k] === undefined || o[k] === "" || (typeof o[k] === "number" && Number.isNaN(o[k]))) && delete o[k]); return o; };
function checkItem(d){
  const w = [], n = d.normal || {}, c = d.caution || {};
  if (d.method === "check") return critText(d) ? w : ["판정 기준을 적어 두면 측정할 때 같이 보여요."];
  if (!has(n.min) && !has(n.max)) w.push("정상 범위가 비어 있어요. 이대로면 판정 없이 값만 기록됩니다.");
  if (has(n.min) && has(n.max) && +n.min > +n.max) w.push("정상 최소가 최대보다 커요.");
  if (has(c.min) && has(c.max) && +c.min > +c.max) w.push("주의 최소가 최대보다 커요.");
  if (has(c.min) && has(n.min) && +c.min > +n.min) w.push("주의 최소는 정상 최소보다 작아야 해요 (주의 범위가 정상 범위를 감싸야 함).");
  if (has(c.max) && has(n.max) && +c.max < +n.max) w.push("주의 최대는 정상 최대보다 커야 해요.");
  return w;
}

    source: clean({doc: x.source?.doc ? String(x.source.doc) : undefined, page: x.source?.page !== undefined ? String(x.source.page) : undefined, quote: x.source?.quote ? String(x.source.quote) : undefined}),

    <div class="card"><b>기준값만 내보내기</b><div class="muted">항목·기준값만 저장합니다. 태블릿 같은 다른 기기에 같은 기준값을 넣을 때 씁니다.</div>
      <div class="row" style="margin-top:8px"><button class="btn" id="ex">기준값 파일 저장</button></div></div>
    <div class="card"><b>연습용 예시 항목</b><div class="muted">[예시]가 붙은 항목 몇 개를 넣거나 지웁니다. 값은 연습용이라 실제 기준이 아니에요.</div>
      <div class="row" style="margin-top:8px"><button class="btn" id="exAdd">예시 넣기</button><button class="btn danger" id="exDel">예시 모두 지우기</button></div></div>
    <div class="card"><b>모두 지우기</b><div class="muted">이 기기에 있는 항목과 기록을 전부 지웁니다.</div>
      <div class="row" style="margin-top:8px"><button class="btn danger" id="wipe">모두 지우기</button></div></div>
    <div class="hint">모든 데이터는 이 기기 안(브라우저 저장소)에만 있고 인터넷으로 보내지 않습니다. 파일로 저장한 백업·기준값 파일도 보안 자료이니 함부로 공유하지 마세요.</div>`);
  $("#bk").onclick = exportBackup; $("#ex").onclick = exportStd;
  $("#rs").onclick = () => { closeModal(); pickFile(importFile); };
  $("#exAdd").onclick = () => { closeModal(); addExamples(); };
  $("#exDel").onclick = async () => { const ids = S.items.filter(i => i.id.startsWith("example-")).map(i => i.id); await DB.delMany("items", ids); const rids = S.records.filter(r => r.itemId.startsWith("example-")).map(r => r.id); await DB.delMany("records", rids); await loadAll(); closeModal(); toast("예시를 지웠어요"); render(); };
  $("#wipe").onclick = async () => { if (!confirm("항목과 기록을 모두 지울까요? 되돌릴 수 없어요.")) return; if (!confirm("정말 지울까요? 백업이 없으면 복구할 수 없어요.")) return; await DB.clear("items"); await DB.clear("records"); await DB.del("meta", "refs"); await loadAll(); S.cur = null; S.ckGroup = ""; closeModal(); render(); };
}

/* ===== 측정법·사진 ===== */
const pageText = pg => esc(/^\d+$/.test(String(pg)) ? pg + "쪽" : pg);
const hasHowto = it => !!(it.where || (it.howto && it.howto.length) || (it.images && it.images.length));
function howtoHTML(it){
  if (!hasHowto(it)) return "";
  const open = ls.get("howto-open", true);
  return `<details class="card howto" ${open ? "open" : ""} id="howto" data-iid="${esc(it.id)}"><summary>📋 측정법·측정 부위${it.images?.length ? ` · 사진 ${it.images.length}장` : ""}</summary>
    ${it.where ? `<div style="margin-top:6px"><b>측정 부위</b><div style="white-space:pre-wrap;line-height:1.6">${esc(it.where)}</div></div>` : ""}
    ${it.howto?.length ? `<div style="margin-top:8px"><b>측정 순서</b><ol>${it.howto.map(h => `<li>${esc(h)}</li>`).join("")}</ol></div>` : ""}
    ${it.images?.length ? `<div class="imgs">${it.images.map((im, i) => `<figure data-img="${i}"><img src="${esc(im.src)}" alt="${esc(im.caption || "사진")}" loading="lazy">${im.caption || im.page ? `<figcaption>${esc(im.caption || "")}${im.page ? ` (${pageText(im.page)})` : ""}</figcaption>` : ""}</figure>`).join("")}</div>` : ""}
  </details>`;
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-rimg]");
  if (r){ const ref = S.refs.find(x => x.id === r.dataset.rid); const im = ref && ref.images[+r.dataset.rimg]; if (im) openViewer(im.src, im.caption || ref.title); return; }
  const f = e.target.closest("#howto [data-img]"); if (!f) return;
  const box = f.closest("[data-iid]"); const it = itemById(box ? box.dataset.iid : S.cur); const im = it && it.images[+f.dataset.img]; if (!im) return;
  openViewer(im.src, im.caption || it.name);
});
document.addEventListener("toggle", e => { if (e.target.id === "howto") ls.set("howto-open", e.target.open); }, true);
let imgCb = null;
const imgIn = document.createElement("input"); imgIn.type = "file"; imgIn.accept = "image/*"; imgIn.hidden = true; document.body.appendChild(imgIn);
imgIn.onchange = () => { const f = imgIn.files[0]; imgIn.value = ""; if (f && imgCb) imgCb(f); };
function pickImage(cb){ imgCb = cb; imgIn.click(); }
function shrinkImage(f, max = 1600){
  return new Promise((res, rej) => { const url = URL.createObjectURL(f); const im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); }; im.src = url; });
}

/* ===== 모달 ===== */
function openModal(html){ closeModal(); const d = document.createElement("div"); d.className = "modal"; d.id = "modal"; d.innerHTML = `<div class="sheet">${html}</div>`;
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-close]")) closeModal(); }); document.body.appendChild(d); document.body.style.overflow = "hidden"; }
function closeModal(){ const d = $("#modal"); if (d) d.remove(); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; const v = $("#modal2"); if (v){ v.remove(); if (!$("#modal")) document.body.style.overflow = ""; } else closeModal(); });

(async () => {

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  render();
  const upd = () => { $("#offline").textContent = navigator.onLine ? "" : "오프라인"; }; addEventListener("online", upd); addEventListener("offline", upd); upd();
  if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
